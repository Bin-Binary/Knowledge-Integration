<svg width="2400" height="1080" viewBox="0 0 2400 1080" xmlns="http://www.w3.org/2000/svg">
<!-- ==========底层固定版式========== -->
<!-- 旧纸张底色：加深但稍微明亮一点点 -->
<rect width="2400" height="1080" fill="#e8e2d5"/>

<!-- 淡网格：稳定色值，不使用opacity -->
<g stroke="#c6c0b4" stroke-width="0.5">
  <!-- 竖线 -->
  <line x1="120" y1="80" x2="120" y2="1000"/>
  <line x1="240" y1="80" x2="240" y2="1000"/>
  <line x1="360" y1="80" x2="360" y2="1000"/>
  <line x1="480" y1="80" x2="480" y2="1000"/>
  <line x1="600" y1="80" x2="600" y2="1000"/>
  <line x1="720" y1="80" x2="720" y2="1000"/>
  <line x1="840" y1="80" x2="840" y2="1000"/>
  <line x1="960" y1="80" x2="960" y2="1000"/>
  <line x1="1080" y1="80" x2="1080" y2="1000"/>
  <line x1="1200" y1="80" x2="1200" y2="1000"/>
  <line x1="1320" y1="80" x2="1320" y2="1000"/>
  <line x1="1440" y1="80" x2="1440" y2="1000"/>
  <line x1="1560" y1="80" x2="1560" y2="1000"/>
  <line x1="1680" y1="80" x2="1680" y2="1000"/>
  <line x1="1800" y1="80" x2="1800" y2="1000"/>
  <line x1="1920" y1="80" x2="1920" y2="1000"/>
  <line x1="2040" y1="80" x2="2040" y2="1000"/>
  <line x1="2160" y1="80" x2="2160" y2="1000"/>
  <line x1="2280" y1="80" x2="2280" y2="1000"/>

  <!-- 横线 -->
  <line x1="120" y1="80" x2="2280" y2="80"/>
  <line x1="120" y1="160" x2="2280" y2="160"/>
  <line x1="120" y1="240" x2="2280" y2="240"/>
  <line x1="120" y1="320" x2="2280" y2="320"/>
  <line x1="120" y1="400" x2="2280" y2="400"/>
  <line x1="120" y1="480" x2="2280" y2="480"/>
  <line x1="120" y1="560" x2="2280" y2="560"/>
  <line x1="120" y1="640" x2="2280" y2="640"/>
  <line x1="120" y1="720" x2="2280" y2="720"/>
  <line x1="120" y1="800" x2="2280" y2="800"/>
  <line x1="120" y1="880" x2="2280" y2="880"/>
  <line x1="120" y1="960" x2="2280" y2="960"/>
</g>

<!-- ==========主体线稿区域========== -->
<g id="main-drawing">
<!-- 在此粘贴生物/GPU/硬件轮廓、解剖结构 -->
</g>

<!-- ==========标注引线组========== -->
<g id="annotations" stroke="#555555" stroke-width="1" stroke-dasharray="6 4" fill="none">
</g>

</svg>
