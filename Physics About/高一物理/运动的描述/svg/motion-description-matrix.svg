<text x="1200" y="72" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">运动的描述：描述层次 × 描述过程</text>
<text x="1200" y="96" text-anchor="middle" font-size="13" fill="#999999">H1建立框架 → H2定义物理量 → H3图像呈现 → H4实验验证 · x-t图斜率 = 速度为核心桥梁</text>

<line x1="280" y1="160" x2="280" y2="740" stroke="#3a3530" stroke-width="2"/>
<line x1="280" y1="740" x2="2200" y2="740" stroke="#3a3530" stroke-width="2"/>
<polygon points="280,160 274,175 286,175" fill="#3a3530"/>
<polygon points="2200,740 2185,734 2185,746" fill="#3a3530"/>

<text x="260" y="674" text-anchor="end" font-size="14" font-weight="bold" fill="#8B7355">H1 参考框架</text>
<text x="260" y="692" text-anchor="end" font-size="11" fill="#999999">§1 质点·参考系</text>
<text x="260" y="534" text-anchor="end" font-size="14" font-weight="bold" fill="#5B7B9B">H2 基本物理量</text>
<text x="260" y="552" text-anchor="end" font-size="11" fill="#999999">§2 时间·位移</text>
<text x="260" y="394" text-anchor="end" font-size="14" font-weight="bold" fill="#6B8E6B">H3 图像工具</text>
<text x="260" y="412" text-anchor="end" font-size="11" fill="#999999">§3 x-t图像</text>
<text x="260" y="234" text-anchor="end" font-size="14" font-weight="bold" fill="#7B6B8B">H4 实验工具</text>
<text x="260" y="252" text-anchor="end" font-size="11" fill="#999999">§4 打点计时器</text>
<text x="90" y="450" text-anchor="middle" font-size="13" fill="#888888" transform="rotate(-90,90,450)">描述层次（底→顶）</text>

<text x="520" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">一 建立框架</text>
<text x="520" y="790" text-anchor="middle" font-size="11" fill="#999999">选参考系·定质点·建坐标</text>
<text x="1000" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">二 定义物理量</text>
<text x="1000" y="790" text-anchor="middle" font-size="11" fill="#999999">Δt·Δx·路程·矢量vs标量</text>
<text x="1480" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">三 图像呈现</text>
<text x="1480" y="790" text-anchor="middle" font-size="11" fill="#999999">x-t图描点·斜率=速度</text>
<text x="1960" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">四 实验验证</text>
<text x="1960" y="790" text-anchor="middle" font-size="11" fill="#999999">打点计时·纸带分析</text>
<text x="1240" y="820" text-anchor="middle" font-size="13" fill="#888888">描述过程 →</text>

<g stroke="#ccc5b8" stroke-width="1" stroke-dasharray="6,4">
<line x1="280" y1="300" x2="2200" y2="300"/>
<line x1="280" y1="460" x2="2200" y2="460"/>
<line x1="280" y1="600" x2="2200" y2="600"/>
<line x1="760" y1="160" x2="760" y2="740"/>
<line x1="1240" y1="160" x2="1240" y2="740"/>
<line x1="1720" y1="160" x2="1720" y2="740"/>
</g>

<rect x="281" y="161" width="1918" height="138" fill="#f0eef5"/>
<rect x="281" y="301" width="1918" height="158" fill="#eaf2ea"/>
<rect x="281" y="461" width="1918" height="138" fill="#eef0f5"/>
<rect x="281" y="601" width="1918" height="138" fill="#f5ede0"/>

<!-- H4 实验工具 (y=230) — 实验验证阶段 -->
<circle cx="1960" cy="230" r="9" fill="#7B6B8B"/>
<text x="1982" y="235" font-size="14" font-weight="bold" fill="#7B6B8B">打点计时器</text>
<text x="2130" y="235" font-size="11" fill="#999999">0.02s/点</text>

<!-- H3 图像工具 (y=380) — 图像呈现 + 实验验证 -->
<circle cx="1480" cy="380" r="9" fill="#6B8E6B"/>
<text x="1502" y="385" font-size="14" font-weight="bold" fill="#6B8E6B">x-t图像</text>
<text x="1600" y="385" font-size="11" fill="#999999">描点连线·斜率=速度</text>

<circle cx="1960" cy="380" r="9" fill="#6B8E6B"/>
<text x="1982" y="385" font-size="14" font-weight="bold" fill="#6B8E6B">纸带验证</text>
<text x="2110" y="385" font-size="11" fill="#999999">纸带数据→x-t图</text>

<!-- H2 基本物理量 (y=530) — 定义物理量 + 图像呈现 + 实验验证 -->
<circle cx="1000" cy="530" r="9" fill="#5B7B9B"/>
<text x="1022" y="535" font-size="14" font-weight="bold" fill="#5B7B9B">位移·路程</text>
<text x="1140" y="535" font-size="11" fill="#999999">Δx=x₂-x₁, s标量</text>

<circle cx="1480" cy="530" r="9" fill="#5B7B9B"/>
<text x="1502" y="535" font-size="14" font-weight="bold" fill="#5B7B9B">坐标纸描点</text>
<text x="1630" y="535" font-size="11" fill="#999999">(t,x)→光滑连线</text>

<circle cx="1960" cy="530" r="9" fill="#5B7B9B"/>
<text x="1982" y="535" font-size="14" font-weight="bold" fill="#5B7B9B">纸带测位移</text>
<text x="2110" y="535" font-size="11" fill="#999999">间距→Δx</text>

<!-- H1 参考框架 (y=670) — 建立框架阶段 -->
<circle cx="520" cy="670" r="9" fill="#8B7355"/>
<text x="542" y="675" font-size="14" font-weight="bold" fill="#8B7355">参考系·质点·坐标系</text>

<rect x="276" y="601" width="8" height="138" fill="#8B7355" rx="2"/>
<rect x="276" y="461" width="8" height="138" fill="#5B7B9B" rx="2"/>
<rect x="276" y="301" width="8" height="158" fill="#6B8E6B" rx="2"/>
<rect x="276" y="161" width="8" height="138" fill="#7B6B8B" rx="2"/>

<rect x="280" y="160" width="1920" height="580" fill="none" stroke="#3a3530" stroke-width="1.5" rx="4"/>

<!-- 图例 -->
<g transform="translate(60,840)">
<text x="0" y="0" font-size="15" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">图例</text>
<line x1="0" y1="10" x2="60" y2="10" stroke="#3a3530" stroke-width="0.8"/>

<circle cx="12" cy="35" r="7" fill="#8B7355"/>
<text x="28" y="39" font-size="13" fill="#666666">H1 参考框架</text>
<text x="150" y="39" font-size="12" fill="#999999">§1: 参考系确定观察立足点 → 质点简化对象 → 坐标系定量描述位置</text>

<circle cx="12" cy="60" r="7" fill="#5B7B9B"/>
<text x="28" y="64" font-size="13" fill="#666666">H2 基本物理量</text>
<text x="150" y="64" font-size="12" fill="#999999">§2: 时刻与时间间隔 → 位移Δx与路程s → 矢量vs标量</text>

<circle cx="12" cy="85" r="7" fill="#6B8E6B"/>
<text x="28" y="89" font-size="13" fill="#666666">H3 图像工具</text>
<text x="150" y="89" font-size="12" fill="#999999">§3: x-t图描点连线 → 斜率=速度方向与快慢 → 水平线=静止</text>

<circle cx="12" cy="110" r="7" fill="#7B6B8B"/>
<text x="28" y="114" font-size="13" fill="#666666">H4 实验工具</text>
<text x="150" y="114" font-size="12" fill="#999999">§4: 打点计时器50Hz → 0.02s/点 → 纸带间距反映运动快慢</text>

<text x="0" y="145" font-size="12" fill="#888888">依赖方向：H4→H3→H2→H1（实验验证图像，图像依赖物理量，物理量依赖框架）</text>
<text x="0" y="165" font-size="12" fill="#888888">核心桥梁：x-t图像的斜率 = 速度，贯穿 §3 图像呈现 与 §4 实验验证</text>
</g>
</svg>
