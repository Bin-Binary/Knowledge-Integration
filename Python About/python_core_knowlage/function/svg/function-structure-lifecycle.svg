<g font-family="Microsoft YaHei,SimHei,sans-serif">

<text x="1200" y="72" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">Python 函数视图：虚拟内存结构 x 生命周期</text>
<text x="1200" y="96" text-anchor="middle" font-size="13" fill="#999999">代码段(->SSD+DRAM) ~ 堆(->DRAM) ~ 栈(->DRAM+Cache+CPU) · 虚拟分区到硬件的映射路径</text>

<line x1="280" y1="160" x2="280" y2="740" stroke="#3a3530" stroke-width="2"/>
<line x1="280" y1="740" x2="2200" y2="740" stroke="#3a3530" stroke-width="2"/>
<polygon points="280,160 274,175 286,175" fill="#3a3530"/>
<polygon points="2200,740 2185,734 2185,746" fill="#3a3530"/>

<text x="100" y="235" text-anchor="end" font-size="10" fill="#C0504D">DRAM+Cache+CPU</text>
<text x="240" y="236" text-anchor="end" font-size="14" font-weight="bold" fill="#C0504D">栈 (Stack)</text>
<text x="240" y="254" text-anchor="end" font-size="11" fill="#999999">调用帧 / 局部变量 / 值栈</text>
<text x="100" y="410" text-anchor="end" font-size="10" fill="#A07050">DRAM</text>
<text x="240" y="416" text-anchor="end" font-size="14" font-weight="bold" fill="#A07050">堆 (Heap)</text>
<text x="240" y="434" text-anchor="end" font-size="11" fill="#999999">函数对象 / 闭包 / 参数元组</text>
<text x="100" y="615" text-anchor="end" font-size="10" fill="#7B6B8B">SSD + DRAM</text>
<text x="240" y="620" text-anchor="end" font-size="14" font-weight="bold" fill="#7B6B8B">代码段 (Code)</text>
<text x="240" y="638" text-anchor="end" font-size="11" fill="#999999">字节码 / 常量表 / 行号映射</text>
<text x="60" y="450" text-anchor="middle" font-size="13" fill="#888888" transform="rotate(-90,60,450)">虚拟分区 (底->顶)</text>

<text x="520" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">L1 解析&编译</text>
<text x="520" y="790" text-anchor="middle" font-size="11" fill="#999999">Parse · Compile</text>
<text x="1000" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">L2 创建&装饰</text>
<text x="1000" y="790" text-anchor="middle" font-size="11" fill="#999999">Make · Decorate</text>
<text x="1480" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">L3 调用&执行</text>
<text x="1480" y="790" text-anchor="middle" font-size="11" fill="#999999">Call · Execute</text>
<text x="1960" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">L4 返回&销毁</text>
<text x="1960" y="790" text-anchor="middle" font-size="11" fill="#999999">Return · Destroy</text>
<text x="1240" y="820" text-anchor="middle" font-size="13" fill="#888888">生命周期 -></text>

<g stroke="#ccc5b8" stroke-width="1" stroke-dasharray="6,4">
<line x1="280" y1="321" x2="2200" y2="321"/>
<line x1="280" y1="511" x2="2200" y2="511"/>
<line x1="740" y1="160" x2="740" y2="740"/>
<line x1="1220" y1="160" x2="1220" y2="740"/>
<line x1="1700" y1="160" x2="1700" y2="740"/>
</g>

<rect x="281" y="161" width="1918" height="159" fill="#f5e5e5"/>
<rect x="281" y="322" width="1918" height="188" fill="#f0e4d8"/>
<rect x="281" y="512" width="1918" height="227" fill="#ece6f0"/>

<circle cx="1480" cy="241" r="9" fill="#C0504D"/>
<text x="1500" y="246" font-size="14" font-weight="bold" fill="#C0504D">帧入栈执行</text>
<text x="1526" y="260" font-size="10" fill="#C0504D">DRAM栈区 -> Cache -> CPU</text>
<circle cx="1960" cy="241" r="9" fill="#C0504D"/>
<text x="1980" y="246" font-size="14" font-weight="bold" fill="#C0504D">帧出栈释放</text>
<text x="1980" y="260" font-size="10" fill="#C0504D">DRAM栈区回收</text>

<circle cx="1000" cy="416" r="9" fill="#A07050"/>
<text x="1020" y="421" font-size="14" font-weight="bold" fill="#A07050">函数对象分配</text>
<text x="1032" y="435" font-size="10" fill="#A07050">DRAM堆区 malloc</text>
<circle cx="1480" cy="416" r="9" fill="#A07050"/>
<text x="1500" y="421" font-size="14" font-weight="bold" fill="#A07050">参数闭包读写</text>
<text x="1500" y="435" font-size="10" fill="#A07050">DRAM堆区 r/w</text>
<circle cx="1960" cy="416" r="9" fill="#A07050"/>
<text x="1980" y="421" font-size="14" font-weight="bold" fill="#A07050">GC 回收释放</text>
<text x="1980" y="435" font-size="10" fill="#A07050">DRAM堆区 free</text>

<circle cx="520" cy="625" r="9" fill="#7B6B8B"/>
<text x="540" y="630" font-size="14" font-weight="bold" fill="#7B6B8B">字节码编译加载</text>
<text x="540" y="644" font-size="10" fill="#7B6B8B">SSD读.py -> DRAM代码段</text>
<circle cx="1000" cy="625" r="9" fill="#7B6B8B"/>
<text x="1020" y="630" font-size="14" font-weight="bold" fill="#7B6B8B">默认参数常量存储</text>
<text x="1032" y="644" font-size="10" fill="#7B6B8B">DRAM代码段: co_consts</text>
<circle cx="1480" cy="625" r="9" fill="#7B6B8B"/>
<text x="1500" y="630" font-size="14" font-weight="bold" fill="#7B6B8B">指令提取执行</text>
<text x="1500" y="644" font-size="10" fill="#7B6B8B">DRAM -> Cache -> CPU取指</text>

<text x="520" y="246" text-anchor="middle" font-size="13" fill="#cccccc">-</text>
<text x="1000" y="246" text-anchor="middle" font-size="13" fill="#cccccc">-</text>
<text x="520" y="421" text-anchor="middle" font-size="13" fill="#cccccc">-</text>
<text x="1960" y="630" text-anchor="middle" font-size="13" fill="#cccccc">-</text>

<rect x="276" y="512" width="8" height="227" fill="#7B6B8B" rx="2"/>
<rect x="276" y="322" width="8" height="188" fill="#A07050" rx="2"/>
<rect x="276" y="161" width="8" height="159" fill="#C0504D" rx="2"/>

<rect x="280" y="160" width="1920" height="580" fill="none" stroke="#3a3530" stroke-width="1.5" rx="4"/>

<g transform="translate(60,840)">
<text x="0" y="0" font-size="15" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">图例：虚拟分区 -> 硬件映射</text>
<line x1="0" y1="10" x2="260" y2="10" stroke="#3a3530" stroke-width="0.8"/>

<text x="0" y="32" font-size="12" font-weight="bold" fill="#3a3530">虚拟分区</text>
<text x="160" y="32" font-size="12" font-weight="bold" fill="#3a3530">-> 硬件组件</text>
<text x="420" y="32" font-size="12" font-weight="bold" fill="#3a3530">说明</text>

<circle cx="8" cy="52" r="5" fill="#C0504D"/><text x="20" y="56" font-size="12" fill="#666666">栈 (Stack)</text>
<text x="160" y="56" font-size="12" fill="#666666">-> DRAM 栈区 + Cache + CPU 寄存器</text>
<text x="420" y="56" font-size="12" fill="#999999">每调用压一帧 · 局部变量/值栈在栈区 · 热数据在 Cache · 寄存器暂存操作数</text>
<circle cx="8" cy="76" r="5" fill="#A07050"/><text x="20" y="80" font-size="12" fill="#666666">堆 (Heap)</text>
<text x="160" y="80" font-size="12" fill="#666666">-> DRAM 堆区</text>
<text x="420" y="80" font-size="12" fill="#999999">PyFunctionObject/PyCellObject 由 malloc 分配 · GC 引用计数标记回收</text>
<circle cx="8" cy="100" r="5" fill="#7B6B8B"/><text x="20" y="104" font-size="12" fill="#666666">代码段 (Code Segment)</text>
<text x="160" y="104" font-size="12" fill="#666666">-> SSD(持久化) + DRAM 代码段(运行时)</text>
<text x="420" y="104" font-size="12" fill="#999999">.py源码/.pyc字节码在SSD · import时mmap到DRAM代码段 · CPU取指经Cache</text>

<line x1="0" y1="118" x2="100" y2="118" stroke="#ccc5b8" stroke-width="0.5"/>
<text x="0" y="140" font-size="12" fill="#888888">数据流: 存储(SSD, .py读) -> 主存(DRAM, 代码段写入) -> 主存(DRAM, 堆分配对象)</text>
<text x="0" y="160" font-size="12" fill="#888888">-> 主存(DRAM, 栈压帧) -> 缓存(Cache, 热数据) -> CPU(执行) -> 主存(DRAM, 返回值) -> 存储(SSD, .pyc写)</text>
</g>

</g>
</svg>