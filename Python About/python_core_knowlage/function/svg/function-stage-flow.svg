<g stroke="#c6c0b4" stroke-width="0.5">
<line x1="120" y1="80" x2="120" y2="1000"/><line x1="240" y1="80" x2="240" y2="1000"/>
<line x1="360" y1="80" x2="360" y2="1000"/><line x1="480" y1="80" x2="480" y2="1000"/>
<line x1="600" y1="80" x2="600" y2="1000"/><line x1="720" y1="80" x2="720" y2="1000"/>
<line x1="840" y1="80" x2="840" y2="1000"/><line x1="960" y1="80" x2="960" y2="1000"/>
<line x1="1080" y1="80" x2="1080" y2="1000"/><line x1="1200" y1="80" x2="1200" y2="1000"/>
<line x1="1320" y1="80" x2="1320" y2="1000"/><line x1="1440" y1="80" x2="1440" y2="1000"/>
<line x1="1560" y1="80" x2="1560" y2="1000"/><line x1="1680" y1="80" x2="1680" y2="1000"/>
<line x1="1800" y1="80" x2="1800" y2="1000"/><line x1="1920" y1="80" x2="1920" y2="1000"/>
<line x1="2040" y1="80" x2="2040" y2="1000"/><line x1="2160" y1="80" x2="2160" y2="1000"/>
<line x1="2280" y1="80" x2="2280" y2="1000"/>
<line x1="120" y1="80" x2="2280" y2="80"/><line x1="120" y1="160" x2="2280" y2="160"/>
<line x1="120" y1="240" x2="2280" y2="240"/><line x1="120" y1="320" x2="2280" y2="320"/>
<line x1="120" y1="400" x2="2280" y2="400"/><line x1="120" y1="480" x2="2280" y2="480"/>
<line x1="120" y1="560" x2="2280" y2="560"/><line x1="120" y1="640" x2="2280" y2="640"/>
<line x1="120" y1="720" x2="2280" y2="720"/><line x1="120" y1="800" x2="2280" y2="800"/>
<line x1="120" y1="880" x2="2280" y2="880"/><line x1="120" y1="960" x2="2280" y2="960"/>
</g>

<defs>
<marker id="a-storage" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#7B6B8B"/>
</marker>
<marker id="a-dram" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#A07050"/>
</marker>
<marker id="a-cache" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#B8956A"/>
</marker>
<marker id="a-cpu" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#C0504D"/>
</marker>
</defs>

<g id="main-drawing" font-family="Microsoft YaHei,SimHei,sans-serif">

<text x="1200" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D3748" font-family="KaiTi,STKaiti,serif">Python 函数阶段流程：Parser -> Compiler -> Make -> Decorate -> Call -> Execute -> Return</text>
<text x="1200" y="132" text-anchor="middle" font-size="12" fill="#999999">内存区域: 代码段(棕) -> 堆(橙) -> 栈(紫) · 虚线=控制流 / 实线=数据流</text>

<rect x="200" y="170" width="240" height="150" fill="none" stroke="#8B7355" stroke-width="1.5" rx="4"/>
<rect x="200" y="170" width="240" height="32" fill="#ede0d2" rx="4"/>
<text x="320" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#8B7355">1. 解析 Parse</text>
<text x="320" y="220" text-anchor="middle" font-size="11" fill="#2D3748">源码 def f(args): body</text>
<text x="320" y="240" text-anchor="middle" font-size="11" fill="#718096">-</text>
<text x="320" y="260" text-anchor="middle" font-size="11" fill="#718096">AST FunctionDef 节点</text>
<text x="320" y="285" text-anchor="middle" font-size="10" fill="#8B7355">词法/语法分析器</text>
<text x="320" y="305" text-anchor="middle" font-size="10" fill="#999999">内存: 代码段</text>

<rect x="470" y="170" width="240" height="150" fill="none" stroke="#8B7355" stroke-width="1.5" rx="4"/>
<rect x="470" y="170" width="240" height="32" fill="#ede0d2" rx="4"/>
<text x="590" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#8B7355">2. 编译 Compile</text>
<text x="590" y="220" text-anchor="middle" font-size="11" fill="#2D3748">AST FunctionDef</text>
<text x="590" y="240" text-anchor="middle" font-size="11" fill="#718096">-</text>
<text x="590" y="260" text-anchor="middle" font-size="11" fill="#718096">PyCodeObject (字节码)</text>
<text x="590" y="285" text-anchor="middle" font-size="10" fill="#8B7355">符号表 -> 字节码生成</text>
<text x="590" y="305" text-anchor="middle" font-size="10" fill="#999999">内存: 代码段</text>

<rect x="740" y="170" width="240" height="150" fill="none" stroke="#A07050" stroke-width="1.5" rx="4"/>
<rect x="740" y="170" width="240" height="32" fill="#f0e4d8" rx="4"/>
<text x="860" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#A07050">3. 构造 Make</text>
<text x="860" y="220" text-anchor="middle" font-size="11" fill="#2D3748">PyCodeObject + globals</text>
<text x="860" y="240" text-anchor="middle" font-size="11" fill="#718096">-</text>
<text x="860" y="260" text-anchor="middle" font-size="11" fill="#718096">PyFunctionObject</text>
<text x="860" y="285" text-anchor="middle" font-size="10" fill="#A07050">MAKE_FUNCTION 指令</text>
<text x="860" y="305" text-anchor="middle" font-size="10" fill="#999999">内存: 堆 (分配对象)</text>

<rect x="1010" y="170" width="240" height="150" fill="none" stroke="#A07050" stroke-width="1.5" rx="4"/>
<rect x="1010" y="170" width="240" height="32" fill="#f0e4d8" rx="4"/>
<text x="1130" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#A07050">4. 装饰 Decorate</text>
<text x="1130" y="220" text-anchor="middle" font-size="11" fill="#2D3748">@decorator 语法</text>
<text x="1130" y="240" text-anchor="middle" font-size="11" fill="#718096">-</text>
<text x="1130" y="260" text-anchor="middle" font-size="11" fill="#718096">wrapper(func) 新对象</text>
<text x="1130" y="285" text-anchor="middle" font-size="10" fill="#A07050">decorator 函数调用链</text>
<text x="1130" y="305" text-anchor="middle" font-size="10" fill="#999999">内存: 堆 (对象替换)</text>

<rect x="1280" y="170" width="240" height="150" fill="none" stroke="#7B6B8B" stroke-width="1.5" rx="4"/>
<rect x="1280" y="170" width="240" height="32" fill="#ece6f0" rx="4"/>
<text x="1400" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B6B8B">5. 调用 Call</text>
<text x="1400" y="220" text-anchor="middle" font-size="11" fill="#2D3748">func(*args, **kwargs)</text>
<text x="1400" y="240" text-anchor="middle" font-size="11" fill="#718096">-</text>
<text x="1400" y="260" text-anchor="middle" font-size="11" fill="#718096">PyFrameObject 压栈</text>
<text x="1400" y="285" text-anchor="middle" font-size="10" fill="#7B6B8B">tp_call -> 参数解析</text>
<text x="1400" y="305" text-anchor="middle" font-size="10" fill="#999999">内存: 堆(参数) + 栈(帧)</text>

<rect x="1550" y="170" width="240" height="150" fill="none" stroke="#7B6B8B" stroke-width="1.5" rx="4"/>
<rect x="1550" y="170" width="240" height="32" fill="#ece6f0" rx="4"/>
<text x="1670" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B6B8B">6. 执行 Execute</text>
<text x="1670" y="220" text-anchor="middle" font-size="11" fill="#2D3748">帧已就绪</text>
<text x="1670" y="240" text-anchor="middle" font-size="11" fill="#718096">-</text>
<text x="1670" y="260" text-anchor="middle" font-size="11" fill="#718096">字节码逐条 eval</text>
<text x="1670" y="285" text-anchor="middle" font-size="10" fill="#7B6B8B">值栈操作/跳转/递归</text>
<text x="1670" y="305" text-anchor="middle" font-size="10" fill="#999999">内存: 栈 (局部变量)</text>

<rect x="1820" y="170" width="240" height="150" fill="none" stroke="#7B6B8B" stroke-width="1.5" rx="4"/>
<rect x="1820" y="170" width="240" height="32" fill="#ece6f0" rx="4"/>
<text x="1940" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B6B8B">7. 返回 Return</text>
<text x="1940" y="220" text-anchor="middle" font-size="11" fill="#2D3748">RETURN_VALUE</text>
<text x="1940" y="240" text-anchor="middle" font-size="11" fill="#718096">-</text>
<text x="1940" y="260" text-anchor="middle" font-size="11" fill="#718096">返回值 -> 调用者</text>
<text x="1940" y="285" text-anchor="middle" font-size="10" fill="#7B6B8B">帧出栈 / 栈展开</text>
<text x="1940" y="305" text-anchor="middle" font-size="10" fill="#999999">内存: 堆(结果) + 栈(释放)</text>

<line x1="440" y1="245" x2="470" y2="245" stroke="#7B6B8B" stroke-width="2" marker-end="url(#a-storage)"/>
<line x1="710" y1="245" x2="740" y2="245" stroke="#7B6B8B" stroke-width="2" marker-end="url(#a-storage)"/>
<line x1="980" y1="245" x2="1010" y2="245" stroke="#A07050" stroke-width="2" marker-end="url(#a-dram)"/>
<line x1="1250" y1="245" x2="1280" y2="245" stroke="#A07050" stroke-width="2" marker-end="url(#a-dram)"/>
<line x1="1520" y1="245" x2="1550" y2="245" stroke="#B8956A" stroke-width="2" marker-end="url(#a-cache)"/>
<line x1="1790" y1="245" x2="1820" y2="245" stroke="#C0504D" stroke-width="2" marker-end="url(#a-cpu)"/>

<text x="1200" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D3748">阶段-角色-产出 对照</text>

<g transform="translate(160,380)">
<rect x="0" y="0" width="2000" height="200" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>

<line x1="200" y1="0" x2="200" y2="200" stroke="#ccc5b8" stroke-width="0.8"/>
<line x1="500" y1="0" x2="500" y2="200" stroke="#ccc5b8" stroke-width="0.8"/>
<line x1="800" y1="0" x2="800" y2="200" stroke="#ccc5b8" stroke-width="0.8"/>
<line x1="1100" y1="0" x2="1100" y2="200" stroke="#ccc5b8" stroke-width="0.8"/>
<line x1="1400" y1="0" x2="1400" y2="200" stroke="#ccc5b8" stroke-width="0.8"/>
<line x1="1700" y1="0" x2="1700" y2="200" stroke="#ccc5b8" stroke-width="0.8"/>

<text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">解析</text>
<text x="100" y="45" text-anchor="middle" font-size="10" fill="#666666">主调: Parser</text>
<text x="100" y="65" text-anchor="middle" font-size="10" fill="#666666">入: 源码字符串</text>
<text x="100" y="85" text-anchor="middle" font-size="10" fill="#666666">出: AST 节点</text>
<text x="100" y="115" text-anchor="middle" font-size="10" fill="#7B6B8B">硬件: 存储(SSD) 读.py</text>

<text x="350" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">编译</text>
<text x="350" y="45" text-anchor="middle" font-size="10" fill="#666666">主调: Compiler</text>
<text x="350" y="65" text-anchor="middle" font-size="10" fill="#666666">入: AST</text>
<text x="350" y="85" text-anchor="middle" font-size="10" fill="#666666">出: PyCodeObject</text>
<text x="350" y="115" text-anchor="middle" font-size="10" fill="#7B6B8B">硬件: 主存 加载字节码</text>

<text x="650" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">构造</text>
<text x="650" y="45" text-anchor="middle" font-size="10" fill="#666666">主调: MAKE_FUNCTION</text>
<text x="650" y="65" text-anchor="middle" font-size="10" fill="#666666">入: Code + globals</text>
<text x="650" y="85" text-anchor="middle" font-size="10" fill="#666666">出: Function Object</text>
<text x="650" y="115" text-anchor="middle" font-size="10" fill="#A07050">硬件: 主存 分配对象</text>

<text x="950" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">装饰</text>
<text x="950" y="45" text-anchor="middle" font-size="10" fill="#666666">主调: Decorator</text>
<text x="950" y="65" text-anchor="middle" font-size="10" fill="#666666">入: 原函数对象</text>
<text x="950" y="85" text-anchor="middle" font-size="10" fill="#666666">出: 被装饰对象</text>
<text x="950" y="115" text-anchor="middle" font-size="10" fill="#A07050">硬件: 主存 对象替换</text>

<text x="1250" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">调用</text>
<text x="1250" y="45" text-anchor="middle" font-size="10" fill="#666666">主调: CALL 指令</text>
<text x="1250" y="65" text-anchor="middle" font-size="10" fill="#666666">入: func + 实参</text>
<text x="1250" y="85" text-anchor="middle" font-size="10" fill="#666666">出: PyFrameObject</text>
<text x="1250" y="115" text-anchor="middle" font-size="10" fill="#B8956A">硬件: 主存+缓存 帧/参</text>

<text x="1550" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">执行</text>
<text x="1550" y="45" text-anchor="middle" font-size="10" fill="#666666">主调: Eval Loop</text>
<text x="1550" y="65" text-anchor="middle" font-size="10" fill="#666666">入: 帧 + 字节码</text>
<text x="1550" y="85" text-anchor="middle" font-size="10" fill="#666666">出: 计算结果</text>
<text x="1550" y="115" text-anchor="middle" font-size="10" fill="#C0504D">硬件: CPU+缓存 执行</text>

<text x="1850" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a3a3a">返回</text>
<text x="1850" y="45" text-anchor="middle" font-size="10" fill="#666666">主调: RETURN_VALUE</text>
<text x="1850" y="65" text-anchor="middle" font-size="10" fill="#666666">入: 帧 + 返回值</text>
<text x="1850" y="85" text-anchor="middle" font-size="10" fill="#666666">出: 调用者获得结果</text>
<text x="1850" y="115" text-anchor="middle" font-size="10" fill="#7B6B8B">硬件: 主存 结果+释放</text>

<line x1="0" y1="135" x2="2000" y2="135" stroke="#ccc5b8" stroke-width="0.8"/>
<text x="1000" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a3a">虚拟分区 + 硬件参与</text>
<text x="100" y="185" text-anchor="middle" font-size="10" fill="#7B6B8B">代码段: SSD 读.py</text>
<text x="350" y="185" text-anchor="middle" font-size="10" fill="#7B6B8B">代码段: DRAM载入, SSD写.pyc</text>
<text x="650" y="185" text-anchor="middle" font-size="10" fill="#A07050">堆: DRAM分配func+闭包</text>
<text x="950" y="185" text-anchor="middle" font-size="10" fill="#A07050">堆: DRAM对象替换</text>
<text x="1250" y="185" text-anchor="middle" font-size="10" fill="#C0504D">栈+堆: DRAM压帧,堆参包</text>
<text x="1550" y="185" text-anchor="middle" font-size="10" fill="#C0504D">栈+代码段: CPU执行,Cache热</text>
<text x="1850" y="185" text-anchor="middle" font-size="10" fill="#C0504D">栈+堆: DRAM帧出栈,堆结果</text>
</g>

<g transform="translate(60,840)">
<text x="0" y="0" font-size="15" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">图例：虚拟分区 -> 硬件</text>
<line x1="0" y1="10" x2="160" y2="10" stroke="#3a3530" stroke-width="0.8"/>
<text x="0" y="30" font-size="12" font-weight="bold" fill="#3a3a3a">虚拟分区</text>
<text x="120" y="30" font-size="12" font-weight="bold" fill="#3a3a3a">-> 硬件</text>
<circle cx="8" cy="48" r="5" fill="#7B6B8B"/><text x="20" y="52" font-size="12" fill="#666666">代码段 (Code)</text><text x="120" y="52" font-size="12" fill="#666666">-> SSD + DRAM</text>
<circle cx="8" cy="70" r="5" fill="#A07050"/><text x="20" y="74" font-size="12" fill="#666666">堆 (Heap)</text><text x="120" y="74" font-size="12" fill="#666666">-> DRAM 堆区</text>
<circle cx="8" cy="92" r="5" fill="#C0504D"/><text x="20" y="96" font-size="12" fill="#666666">栈 (Stack)</text><text x="120" y="96" font-size="12" fill="#666666">-> DRAM + Cache + CPU</text>
<text x="0" y="120" font-size="12" fill="#999999">阶段间实线箭头 = 控制流转移 · 阶段按序推进</text>
<text x="0" y="142" font-size="12" fill="#999999">异常流程: 任意阶段可能抛异常 -> 栈帧出栈 -> DRAM释放 -> traceback</text>
</g>

</g>
</svg>