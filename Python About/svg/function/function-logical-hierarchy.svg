<rect x="880" y="168" width="1280" height="170" fill="none" stroke="#7B6B8B" stroke-width="1.5" rx="4"/>
<rect x="880" y="168" width="1280" height="32" fill="#f5f3f5" rx="4"/>
<text x="1520" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B6B8B">语法层实现载体</text>
<text x="1520" y="215" text-anchor="middle" font-size="12" fill="#2D3748">Python语法 -> AST节点 (CPython解析器)</text>
<rect x="895" y="230" width="310" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="1050" y="249" text-anchor="middle" font-size="11" fill="#2D3748">AST FunctionDef 节点</text>
<rect x="1215" y="230" width="310" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="1370" y="249" text-anchor="middle" font-size="11" fill="#2D3748">AST Lambda 节点</text>
<rect x="1535" y="230" width="310" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="1690" y="249" text-anchor="middle" font-size="11" fill="#2D3748">AST AsyncFunctionDef 节点</text>
<rect x="1855" y="230" width="290" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="2000" y="249" text-anchor="middle" font-size="11" fill="#2D3748">ast.Call 装饰器等价</text>
<rect x="895" y="262" width="620" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="1205" y="281" text-anchor="middle" font-size="11" fill="#2D3748">职责: 源码字符串 -> 词法分析(tokenize) -> 语法分析(parser) -> CST -> AST</text>
<rect x="1525" y="262" width="620" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="1835" y="281" text-anchor="middle" font-size="11" fill="#2D3748">产出: FunctionDef.name / .args / .body / .decorator_list / .returns</text>
<rect x="895" y="294" width="1250" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="1520" y="313" text-anchor="middle" font-size="11" fill="#2D3748">标记: CO_GENERATOR(含Yield) / CO_COROUTINE(async def) / co_freevars(闭包变量) 编译期识别</text>

<rect x="880" y="358" width="1280" height="170" fill="none" stroke="#8B7355" stroke-width="1.5" rx="4"/>
<rect x="880" y="358" width="1280" height="32" fill="#f5f0e8" rx="4"/>
<text x="1520" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#8B7355">编译层实现载体</text>
<text x="1520" y="405" text-anchor="middle" font-size="12" fill="#2D3748">AST -> PyCodeObject (CPython编译器 compile.c)</text>
<rect x="895" y="420" width="310" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="1050" y="439" text-anchor="middle" font-size="11" fill="#2D3748">symtable.c 符号表构建</text>
<rect x="1215" y="420" width="310" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="1370" y="439" text-anchor="middle" font-size="11" fill="#2D3748">ceval.c 字节码生成</text>
<rect x="1535" y="420" width="310" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="1690" y="439" text-anchor="middle" font-size="11" fill="#2D3748">co_code 字节码序列</text>
<rect x="1855" y="420" width="290" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="2000" y="439" text-anchor="middle" font-size="11" fill="#2D3748">co_lnotab 行号映射</text>
<rect x="895" y="452" width="620" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="1205" y="471" text-anchor="middle" font-size="11" fill="#2D3748">职责: AST遍历 -> 作用域分析 -> 栈深度计算 -> 控制流图 -> 字节码优化 -> 生成PyCodeObject</text>
<rect x="1525" y="452" width="620" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="1835" y="471" text-anchor="middle" font-size="11" fill="#2D3748">产出: co_varnames / co_names / co_consts / co_freevars / co_cellvars</text>
<rect x="895" y="484" width="1250" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="1520" y="503" text-anchor="middle" font-size="11" fill="#2D3748">关键: co_stacksize(值栈深度) / co_nlocals(局部变量数) / co_argcount / co_kwonlyargcount / co_flags</text>

<rect x="880" y="548" width="1280" height="170" fill="none" stroke="#A07050" stroke-width="1.5" rx="4"/>
<rect x="880" y="548" width="1280" height="32" fill="#f5ede5" rx="4"/>
<text x="1520" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#A07050">运行时层实现载体</text>
<text x="1520" y="595" text-anchor="middle" font-size="12" fill="#2D3748">PyCodeObject + globals -> PyFunctionObject (MAKE_FUNCTION指令)</text>
<rect x="895" y="610" width="310" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="1050" y="629" text-anchor="middle" font-size="11" fill="#2D3748">PyFunctionObject</text>
<rect x="1215" y="610" width="310" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="1370" y="629" text-anchor="middle" font-size="11" fill="#2D3748">PyMethodObject</text>
<rect x="1535" y="610" width="310" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="1690" y="629" text-anchor="middle" font-size="11" fill="#2D3748">PyCellObject (闭包单元)</text>
<rect x="1855" y="610" width="290" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="2000" y="629" text-anchor="middle" font-size="11" fill="#2D3748">types.FunctionType</text>
<rect x="895" y="642" width="620" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="1205" y="661" text-anchor="middle" font-size="11" fill="#2D3748">职责: 封装 code object + 全局命名空间 + 默认参数 + 闭包单元 -> 可调用的第一类对象</text>
<rect x="1525" y="642" width="620" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="1835" y="661" text-anchor="middle" font-size="11" fill="#2D3748">字段: __code__ / __globals__ / __defaults__ / __closure__ / __name__</text>
<rect x="895" y="674" width="1250" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="1520" y="693" text-anchor="middle" font-size="11" fill="#2D3748">特殊: bound method(__self__绑定实例) / staticmethod(不绑定) / classmethod(绑定类) / partial(部分应用)</text>

<rect x="880" y="738" width="1280" height="170" fill="none" stroke="#4A6B5A" stroke-width="1.5" rx="4"/>
<rect x="880" y="738" width="1280" height="32" fill="#e8f0e8" rx="4"/>
<text x="1520" y="760" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A6B5A">执行层实现载体</text>
<text x="1520" y="785" text-anchor="middle" font-size="12" fill="#2D3748">CALL指令 -> PyFrameObject -> eval loop -> RETURN_VALUE</text>
<rect x="895" y="800" width="310" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="1050" y="819" text-anchor="middle" font-size="11" fill="#2D3748">PyFrameObject</text>
<rect x="1215" y="800" width="310" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="1370" y="819" text-anchor="middle" font-size="11" fill="#2D3748">PyGenObject 生成器</text>
<rect x="1535" y="800" width="310" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="1690" y="819" text-anchor="middle" font-size="11" fill="#2D3748">PyCoroObject 协程</text>
<rect x="1855" y="800" width="290" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="2000" y="819" text-anchor="middle" font-size="11" fill="#2D3748">_PyInterpreterFrame (3.11+)</text>
<rect x="895" y="832" width="620" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="1205" y="851" text-anchor="middle" font-size="11" fill="#2D3748">职责: 参数解析 -> 帧分配 -> 局部变量初始化 -> 字节码逐条执行 -> 值栈操作 -> 异常捕获 -> 返回值传递</text>
<rect x="1525" y="832" width="620" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="1835" y="851" text-anchor="middle" font-size="11" fill="#2D3748">字段: f_back / f_code / f_locals / f_globals / f_lasti / f_valuestack</text>
<rect x="895" y="864" width="1250" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
