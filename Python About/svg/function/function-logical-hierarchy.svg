<g id="main-drawing" font-family="Microsoft YaHei,SimHei,sans-serif">

<text x="1200" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D3748" font-family="KaiTi,STKaiti,serif">Python 函数逻辑层级视图：从语法到执行的抽象层次</text>

<text x="400" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#7B6B8B">逻辑概念层</text>
<text x="1560" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3a3a">实现载体与职责</text>

<rect x="160" y="168" width="480" height="170" fill="none" stroke="#7B6B8B" stroke-width="1.5" rx="4"/>
<rect x="160" y="168" width="480" height="32" fill="#ece6f0" rx="4"/>
<text x="400" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B6B8B">1. 语法层 (Syntax Layer)</text>
<text x="400" y="215" text-anchor="middle" font-size="12" fill="#2D3748">函数定义的抽象语法表达</text>
<rect x="175" y="230" width="220" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="285" y="249" text-anchor="middle" font-size="11" fill="#2D3748">def 语句 / lambda 表达式</text>
<rect x="405" y="230" width="220" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="515" y="249" text-anchor="middle" font-size="11" fill="#2D3748">@decorator 装饰器语法</text>
<rect x="175" y="262" width="220" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="285" y="281" text-anchor="middle" font-size="11" fill="#2D3748">async def 异步函数</text>
<rect x="405" y="262" width="220" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="515" y="281" text-anchor="middle" font-size="11" fill="#2D3748">yield / yield from 生成器</text>
<rect x="175" y="294" width="220" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="285" y="313" text-anchor="middle" font-size="11" fill="#2D3748">类型注解 annotations</text>
<rect x="405" y="294" width="220" height="28" fill="#f5f5f5" stroke="#7B6B8B" stroke-width="0.6" rx="3"/>
<text x="515" y="313" text-anchor="middle" font-size="11" fill="#2D3748">闭包 (嵌套 def 读外层变量)</text>

<rect x="160" y="358" width="480" height="170" fill="none" stroke="#8B7355" stroke-width="1.5" rx="4"/>
<rect x="160" y="358" width="480" height="32" fill="#ede0d2" rx="4"/>
<text x="400" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#8B7355">2. 编译层 (Compilation Layer)</text>
<text x="400" y="405" text-anchor="middle" font-size="12" fill="#2D3748">AST 到字节码的转换过程</text>
<rect x="175" y="420" width="220" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="285" y="439" text-anchor="middle" font-size="11" fill="#2D3748">AST -> 符号表 -> 控制流图</text>
<rect x="405" y="420" width="220" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="515" y="439" text-anchor="middle" font-size="11" fill="#2D3748">字节码序列 (co_code)</text>
<rect x="175" y="452" width="220" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="285" y="471" text-anchor="middle" font-size="11" fill="#2D3748">co_freevars 自由变量标记</text>
<rect x="405" y="452" width="220" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="515" y="471" text-anchor="middle" font-size="11" fill="#2D3748">co_cellvars 单元变量标记</text>
<rect x="175" y="484" width="450" height="28" fill="#f5f5f5" stroke="#8B7355" stroke-width="0.6" rx="3"/>
<text x="400" y="503" text-anchor="middle" font-size="11" fill="#2D3748">co_flags (CO_OPTIMIZED / CO_NOFREE / CO_GENERATOR / CO_COROUTINE)</text>

<rect x="160" y="548" width="480" height="170" fill="none" stroke="#A07050" stroke-width="1.5" rx="4"/>
<rect x="160" y="548" width="480" height="32" fill="#f0e4d8" rx="4"/>
<text x="400" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#A07050">3. 运行时层 (Runtime Layer)</text>
<text x="400" y="595" text-anchor="middle" font-size="12" fill="#2D3748">函数作为第一类对象的运行时表示</text>
<rect x="175" y="610" width="220" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="285" y="629" text-anchor="middle" font-size="11" fill="#2D3748">PyFunctionObject (funcobject.c)</text>
<rect x="405" y="610" width="220" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="515" y="629" text-anchor="middle" font-size="11" fill="#2D3748">bound / unbound method</text>
<rect x="175" y="642" width="220" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="285" y="661" text-anchor="middle" font-size="11" fill="#2D3748">闭包单元 PyCellObject</text>
<rect x="405" y="642" width="220" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="515" y="661" text-anchor="middle" font-size="11" fill="#2D3748">__annotations__ / __doc__</text>
<rect x="175" y="674" width="220" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="285" y="693" text-anchor="middle" font-size="11" fill="#2D3748">staticmethod / classmethod</text>
<rect x="405" y="674" width="220" height="28" fill="#f5f5f5" stroke="#A07050" stroke-width="0.6" rx="3"/>
<text x="515" y="693" text-anchor="middle" font-size="11" fill="#2D3748">functools.partial</text>

<rect x="160" y="738" width="480" height="170" fill="none" stroke="#4A6B5A" stroke-width="1.5" rx="4"/>
<rect x="160" y="738" width="480" height="32" fill="#dae8dc" rx="4"/>
<text x="400" y="760" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A6B5A">4. 执行层 (Execution Layer)</text>
<text x="400" y="785" text-anchor="middle" font-size="12" fill="#2D3748">函数体实际执行的上下文与机制</text>
<rect x="175" y="800" width="220" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="285" y="819" text-anchor="middle" font-size="11" fill="#2D3748">PyFrameObject 栈帧</text>
<rect x="405" y="800" width="220" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="515" y="819" text-anchor="middle" font-size="11" fill="#2D3748">值栈 f_valuestack</text>
<rect x="175" y="832" width="220" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="285" y="851" text-anchor="middle" font-size="11" fill="#2D3748">PyGenObject 生成器挂起</text>
<rect x="405" y="832" width="220" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="515" y="851" text-anchor="middle" font-size="11" fill="#2D3748">PyCoroObject 协程调度</text>
<rect x="175" y="864" width="220" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="285" y="883" text-anchor="middle" font-size="11" fill="#2D3748">异常处理 栈展开 unwind</text>
<rect x="405" y="864" width="220" height="28" fill="#f5f5f5" stroke="#4A6B5A" stroke-width="0.6" rx="3"/>
<text x="515" y="883" text-anchor="middle" font-size="11" fill="#2D3748">trace function / debugger</text>

<path d="M640,253 C760,253 760,253 880,253" stroke="#7B6B8B" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#a-l1)"/>
<path d="M640,443 C760,443 760,443 880,443" stroke="#8B7355" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#a-l2)"/>
