<svg width="2400" height="1080" viewBox="0 0 2400 1080" xmlns="http://www.w3.org/2000/svg">
<!-- ==========底层版式========== -->
<rect width="2400" height="1080" fill="#e8e2d5"/>
<g stroke="#c6c0b4" stroke-width="0.5">
  <line x1="120" y1="80" x2="2280" y2="80"/><line x1="120" y1="160" x2="2280" y2="160"/>
  <line x1="120" y1="240" x2="2280" y2="240"/><line x1="120" y1="320" x2="2280" y2="320"/>
  <line x1="120" y1="400" x2="2280" y2="400"/><line x1="120" y1="480" x2="2280" y2="480"/>
  <line x1="120" y1="560" x2="2280" y2="560"/><line x1="120" y1="640" x2="2280" y2="640"/>
  <line x1="120" y1="720" x2="2280" y2="720"/><line x1="120" y1="800" x2="2280" y2="800"/>
  <line x1="120" y1="880" x2="2280" y2="880"/><line x1="120" y1="960" x2="2280" y2="960"/>
  <line x1="120" y1="80" x2="120" y2="1000"/><line x1="240" y1="80" x2="240" y2="1000"/>
  <line x1="360" y1="80" x2="360" y2="1000"/><line x1="480" y1="80" x2="480" y2="1000"/>
  <line x1="600" y1="80" x2="600" y2="1000"/><line x1="720" y1="80" x2="720" y2="1000"/>
  <line x1="840" y1="80" x2="840" y2="1000"/><line x1="960" y1="80" x2="960" y2="1000"/>
  <line x1="1080" y1="80" x2="1080" y2="1000"/><line x1="1200" y1="80" x2="1200" y2="1000"/>
  <line x1="1320" y1="80" x2="1320" y2="1000"/><line x1="1440" y1="80" x2="1440" y2="1000"/>
  <line x1="1560" y1="80" x2="1560" y2="1000"/><line x1="1680" y1="80" x2="1680" y2="1000"/>
  <line x1="1800" y1="80" x2="1800" y2="1000"/><line x1="1920" y1="80" x2="1920" y2="1000"/>
  <line x1="2040" y1="80" x2="2040" y2="1000"/><line x1="2160" y1="80" x2="2160" y2="1000"/>
  <line x1="2280" y1="80" x2="2280" y2="1000"/>
</g>

<g id="main-drawing" font-family="Microsoft YaHei, SimHei, sans-serif">

  <!-- 标题 -->
  <text x="1200" y="72" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">Python对象模型：实例快照 × 生命周期</text>
  <text x="1200" y="96" text-anchor="middle" font-size="13" fill="#999999">H1 CPython运行时 → H2 元类型根 → H3 元类层 → H4 类层 → H5 实例层  ·  自底向上，每一层即实例在那一时刻的快照</text>

  <!-- ==========坐标轴========== -->
  <line x1="280" y1="140" x2="280" y2="760" stroke="#3a3530" stroke-width="2"/>
  <line x1="280" y1="760" x2="2240" y2="760" stroke="#3a3530" stroke-width="2"/>
  <polygon points="280,140 274,155 286,155" fill="#3a3530"/>
  <polygon points="2240,760 2225,754 2225,766" fill="#3a3530"/>

  <!-- Y轴标签 -->
  <text x="260" y="702" text-anchor="end" font-size="14" font-weight="bold" fill="#8B7355">H1 CPython运行时</text>
  <text x="260" y="720" text-anchor="end" font-size="11" fill="#999999">PyObject · tp_new 分配</text>
  <text x="260" y="578" text-anchor="end" font-size="14" font-weight="bold" fill="#A07050">H2 元类型根</text>
  <text x="260" y="596" text-anchor="end" font-size="11" fill="#999999">type / object · __call__ 接管</text>
  <text x="260" y="454" text-anchor="end" font-size="14" font-weight="bold" fill="#6B8E6B">H3 元类层</text>
  <text x="260" y="472" text-anchor="end" font-size="11" fill="#999999">metaclass · 创建管线控制</text>
  <text x="260" y="330" text-anchor="end" font-size="14" font-weight="bold" fill="#5B7BA0">H4 类层</text>
  <text x="260" y="348" text-anchor="end" font-size="11" fill="#999999">class · __new__ + __init__</text>
  <text x="260" y="206" text-anchor="end" font-size="14" font-weight="bold" fill="#8B6B9B">H5 实例层</text>
  <text x="260" y="224" text-anchor="end" font-size="11" fill="#999999">instance · __dict__ 就绪</text>
  <text x="90" y="450" text-anchor="middle" font-size="13" fill="#888888" transform="rotate(-90,90,450)">实例快照（底→顶）</text>

  <!-- X轴标签 -->
  <text x="476" y="790" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">定义期</text>
  <text x="868" y="790" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">构建期</text>
  <text x="1260" y="790" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">实例化期</text>
  <text x="1652" y="790" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">运行期</text>
  <text x="2044" y="790" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">销毁期</text>
  <text x="476" y="810" text-anchor="middle" font-size="11" fill="#999999">类型声明</text>
  <text x="868" y="810" text-anchor="middle" font-size="11" fill="#999999">类构造 · 槽位初始化</text>
  <text x="1260" y="810" text-anchor="middle" font-size="11" fill="#999999">对象创建 · 属性填充</text>
  <text x="1652" y="810" text-anchor="middle" font-size="11" fill="#999999">属性查找 · 方法调用</text>
  <text x="2044" y="810" text-anchor="middle" font-size="11" fill="#999999">引用回收 · GC扫描</text>
  <text x="1260" y="845" text-anchor="middle" font-size="13" fill="#888888">生命周期 →</text>

  <!-- ==========矩阵网格========== -->
  <g stroke="#ccc5b8" stroke-width="1" stroke-dasharray="6,4">
    <line x1="280" y1="264" x2="2240" y2="264"/>
    <line x1="280" y1="388" x2="2240" y2="388"/>
    <line x1="280" y1="512" x2="2240" y2="512"/>
    <line x1="280" y1="636" x2="2240" y2="636"/>
    <line x1="672" y1="140" x2="672" y2="760"/>
    <line x1="1064" y1="140" x2="1064" y2="760"/>
    <line x1="1456" y1="140" x2="1456" y2="760"/>
    <line x1="1848" y1="140" x2="1848" y2="760"/>
  </g>

  <!-- 行背景色带 & 矩阵外框 & Y轴色标 -->
  <rect x="281" y="141" width="1958" height="122" fill="#f0e8f2"/>
  <rect x="281" y="265" width="1958" height="122" fill="#e8eef5"/>
  <rect x="281" y="389" width="1958" height="122" fill="#eaf2ea"/>
  <rect x="281" y="513" width="1958" height="122" fill="#f4eae4"/>
  <rect x="281" y="637" width="1958" height="122" fill="#f5ede0"/>
  <rect x="280" y="140" width="1960" height="620" fill="none" stroke="#3a3530" stroke-width="1.5" rx="4"/>
  <rect x="276" y="637" width="8" height="122" fill="#8B7355" rx="2"/>
  <rect x="276" y="513" width="8" height="122" fill="#A07050" rx="2"/>
  <rect x="276" y="389" width="8" height="122" fill="#6B8E6B" rx="2"/>
  <rect x="276" y="265" width="8" height="122" fill="#5B7BA0" rx="2"/>
  <rect x="276" y="141" width="8" height="122" fill="#8B6B9B" rx="2"/>

  <!-- ================================================================ -->
  <!--  数据点：圆点 + 关键词                                              -->
  <!-- ================================================================ -->

  <!-- H5 实例层 (y=202, #8B6B9B) — 只有实例化期之后才有实例 -->
  <text x="476" y="206" text-anchor="middle" font-size="12" fill="#bbbbbb">—</text>
  <text x="868" y="206" text-anchor="middle" font-size="12" fill="#bbbbbb">—</text>
  <circle cx="1260" cy="202" r="8" fill="#8B6B9B"/>
  <text x="1275" y="206" font-size="13" font-weight="bold" fill="#8B6B9B">实例诞生</text>
  <circle cx="1652" cy="202" r="8" fill="#8B6B9B"/>
  <text x="1667" y="206" font-size="13" font-weight="bold" fill="#8B6B9B">对外服务</text>
  <circle cx="2044" cy="202" r="8" fill="#8B6B9B"/>
  <text x="2059" y="206" font-size="13" font-weight="bold" fill="#8B6B9B">__del__</text>

  <!-- H4 类层 (y=326, #5B7BA0) -->
  <text x="476" y="330" text-anchor="middle" font-size="12" fill="#bbbbbb">—</text>
  <circle cx="868" cy="326" r="8" fill="#5B7BA0"/>
  <text x="883" y="330" font-size="13" font-weight="bold" fill="#5B7BA0">class body执行</text>
  <circle cx="1260" cy="326" r="8" fill="#5B7BA0"/>
  <text x="1275" y="330" font-size="13" font-weight="bold" fill="#5B7BA0">__new__+__init__</text>
  <circle cx="1652" cy="326" r="8" fill="#5B7BA0"/>
  <text x="1667" y="330" font-size="13" font-weight="bold" fill="#5B7BA0">属性查找链</text>
  <circle cx="2044" cy="326" r="8" fill="#5B7BA0"/>
  <text x="2059" y="330" font-size="13" font-weight="bold" fill="#5B7BA0">class.__del__</text>

  <!-- H3 元类层 (y=450, #6B8E6B) -->
  <circle cx="476" cy="450" r="8" fill="#6B8E6B"/>
  <text x="491" y="454" font-size="13" font-weight="bold" fill="#6B8E6B">metaclass声明</text>
  <circle cx="868" cy="450" r="8" fill="#6B8E6B"/>
  <text x="883" y="454" font-size="13" font-weight="bold" fill="#6B8E6B">类工厂执行</text>
  <circle cx="1260" cy="450" r="8" fill="#6B8E6B"/>
  <text x="1275" y="454" font-size="13" font-weight="bold" fill="#6B8E6B">创建拦截</text>
  <circle cx="1652" cy="450" r="8" fill="#6B8E6B"/>
  <text x="1667" y="454" font-size="13" font-weight="bold" fill="#6B8E6B">调用拦截</text>
  <circle cx="2044" cy="450" r="8" fill="#6B8E6B"/>
  <text x="2059" y="454" font-size="13" font-weight="bold" fill="#6B8E6B">类清理</text>

  <!-- H2 元类型根 (y=574, #A07050) -->
  <circle cx="476" cy="574" r="8" fill="#A07050"/>
  <text x="491" y="578" font-size="13" font-weight="bold" fill="#A07050">root创建</text>
  <circle cx="868" cy="574" r="8" fill="#A07050"/>
  <text x="883" y="578" font-size="13" font-weight="bold" fill="#A07050">type.__new__</text>
  <circle cx="1260" cy="574" r="8" fill="#A07050"/>
  <text x="1275" y="578" font-size="13" font-weight="bold" fill="#A07050">__call__驱动</text>
  <circle cx="1652" cy="574" r="8" fill="#A07050"/>
  <text x="1667" y="578" font-size="13" font-weight="bold" fill="#A07050">默认解析器</text>
  <circle cx="2044" cy="574" r="8" fill="#A07050"/>
  <text x="2059" y="578" font-size="13" font-weight="bold" fill="#A07050">object.__del__</text>

  <!-- H1 CPython运行时 (y=698, #8B7355) -->
  <circle cx="476" cy="698" r="8" fill="#8B7355"/>
  <text x="491" y="702" font-size="13" font-weight="bold" fill="#8B7355">结构定义</text>
  <circle cx="868" cy="698" r="8" fill="#8B7355"/>
  <text x="883" y="702" font-size="13" font-weight="bold" fill="#8B7355">PyType_Ready</text>
  <circle cx="1260" cy="698" r="8" fill="#8B7355"/>
  <text x="1275" y="702" font-size="13" font-weight="bold" fill="#8B7355">tp_new分配</text>
  <circle cx="1652" cy="698" r="8" fill="#8B7355"/>
  <text x="1667" y="702" font-size="13" font-weight="bold" fill="#8B7355">tp_getattro</text>
  <circle cx="2044" cy="698" r="8" fill="#8B7355"/>
  <text x="2059" y="702" font-size="13" font-weight="bold" fill="#8B7355">tp_dealloc</text>

  <!-- ==========实例化期高亮列========== -->
  <rect x="1065" y="141" width="390" height="618" fill="none" stroke="#c88a3b" stroke-width="1.2" stroke-dasharray="4,4" rx="2"/>

  <!-- ==========图例========== -->
  <g transform="translate(60,860)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">图例</text>
    <line x1="0" y1="10" x2="60" y2="10" stroke="#3a3530" stroke-width="0.8"/>

    <circle cx="12" cy="30" r="7" fill="#8B7355"/>
    <text x="28" y="34" font-size="12" fill="#666666"><tspan font-weight="bold" fill="#8B7355">H1 CPython运行时</tspan>  —  PyObject头文件定义 → PyType_Ready初始化tp_* → tp_new分配PyObject内存·ob_refcnt=1 → tp_getattro/tp_call服务 → tp_dealloc释放+GC扫描</text>

    <circle cx="12" cy="56" r="7" fill="#A07050"/>
    <text x="28" y="60" font-size="12" fill="#666666"><tspan font-weight="bold" fill="#A07050">H2 元类型根</tspan>  —  object/type启动创建·type(type)==type → type.__new__类构建+C3生成MRO → type.__call__驱动__new__→__init__链 → object.__getattribute__默认解析器 → object.__del__析构</text>

    <circle cx="12" cy="82" r="7" fill="#6B8E6B"/>
    <text x="28" y="86" font-size="12" fill="#666666"><tspan font-weight="bold" fill="#6B8E6B">H3 元类层</tspan>  —  class Foo(metaclass=Meta):声明 → __prepare__/__new__/__init_subclass__工厂 → metaclass.__call__控制创建管线 → __call__单例/注册拦截 → __del__类清理</text>

    <circle cx="12" cy="108" r="7" fill="#5B7BA0"/>
    <text x="28" y="112" font-size="12" fill="#666666"><tspan font-weight="bold" fill="#5B7BA0">H4 类层</tspan>  —  (不参与定义) → class body执行·__dict__/MRO/__slots__/descriptor就位 → __new__分配+__init__填充 → __getattribute__→MRO→descriptor→__dict__→__getattr__查找链 → __del__析构</text>

    <circle cx="12" cy="134" r="7" fill="#8B6B9B"/>
    <text x="28" y="138" font-size="12" fill="#666666"><tspan font-weight="bold" fill="#8B6B9B">H5 实例层</tspan>  —  (不参与定义/构建) → instance.__dict__就绪·ob_type指向类·方法绑定为bound method → a.x→type(a).__getattribute__对外服务 → __dict__释放·__del__最多调用一次</text>

    <line x1="0" y1="158" x2="120" y2="158" stroke="#c88a3b" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="130" y="162" font-size="11" fill="#c88a3b">虚线框 = 实例化期（唯一五层全参与的快照链阶段）</text>

    <text x="0" y="185" font-size="11" fill="#999999">● 圆点 = 该层（快照）在该生命阶段有活跃状态　　　— = 该阶段尚未进入/已退出</text>
  </g>

</g>

<g id="annotations" stroke="#555555" stroke-width="1" stroke-dasharray="6 4" fill="none">
</g>
</svg>
