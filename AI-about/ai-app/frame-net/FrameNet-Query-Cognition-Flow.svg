<text x="1070" y="459" font-size="10" fill="#777777">Result</text>
<rect x="1128" y="424" width="100" height="46" rx="5" fill="#f0ece2" stroke="#c9c2b4"/>
<text x="1178" y="443" fill="#3a3530" font-weight="bold">InformationResult</text>
<text x="1178" y="459" font-size="10" fill="#777777">帧内槽位</text>
<rect x="1236" y="424" width="144" height="46" rx="5" fill="#f0ecf5" stroke="#7b5fb5"/>
<text x="1308" y="443" fill="#7b5fb5">信息 · 数据承载</text>
<text x="1308" y="459" font-size="10" fill="#8a8f98">承载返回</text>
</g>

<text x="1020" y="536" font-size="13" font-weight="bold" fill="#2f9e5f">「FE 为键」</text>
<text x="1020" y="556" font-size="11.5" fill="#555555">绑定 / 澄清 / Qualia 三表的行键 = 帧内 FE 名(如 Pipeline、</text>
<text x="1020" y="574" font-size="11.5" fill="#555555">Target)，而非抽象的「语义角色」——实体跨帧用同名 FE 对齐。</text>

<text x="1020" y="616" font-size="13" font-weight="bold" fill="#2f9e5f">「类型平面」= 实体所在层</text>
<text x="1020" y="636" font-size="11.5" fill="#555555">实体挂在 L3 语义类型上；先判 L3 实体类别，再回填 L2 FE ——</text>
<text x="1020" y="654" font-size="11.5" fill="#555555">实体资格由 L3 类型平面授予(受事/施事由帧槽位决定)。</text>

<text x="1020" y="696" font-size="13" font-weight="bold" fill="#2f9e5f">「Qualia 资格」</text>
<text x="1020" y="716" font-size="11.5" fill="#555555">实体族(Artifact/System)FE 才有 Qualia 行；施事族与信息维 FE</text>
<text x="1020" y="734" font-size="11.5" fill="#555555">无行 —— 这是列④ 表「以 FE 为键」的挂载依据。</text>
<!-- ==========④ Qualia 绑定========== -->
<rect x="1440" y="118" width="400" height="40" rx="6" fill="#7b5fb5"/>
