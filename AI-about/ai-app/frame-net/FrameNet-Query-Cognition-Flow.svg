<text x="1460" y="196" font-size="12" font-weight="bold" fill="#7b5fb5">Qualia 表 (实体族 FE 专属 · 行键 = F4.Pipeline)</text>

<rect x="1460" y="208" width="360" height="352" rx="8" fill="#f0ecf5" stroke="#7b5fb5" stroke-width="1.5"/>
<text x="1480" y="234" font-size="13" font-weight="bold" fill="#7b5fb5">主体 FE: Pipeline · 流水线实体</text>
<text x="1480" y="252" font-size="11" fill="#777777">Pustejovsky Qualia Structure · 四维</text>
<line x1="1476" y1="260" x2="1804" y2="260" stroke="#d6cce2" stroke-width="1"/>

<g font-size="12">
<rect x="1476" y="272" width="328" height="56" rx="5" fill="#f3eef7" stroke="#e0d8ea"/>
<text x="1490" y="292" font-weight="bold" fill="#7b5fb5">formal 形式</text>
<text x="1490" y="312" font-size="11" fill="#555555">类型 · 标识 · 规模(微服务/版本域)</text>

<rect x="1476" y="336" width="328" height="56" rx="5" fill="#fbeee6" stroke="#c88a3b" stroke-width="1.5"/>
<text x="1490" y="356" font-weight="bold" fill="#c88a3b">constitutive 构件 ← 命中</text>
<text x="1490" y="376" font-size="11" fill="#8a5a20">阶段 · 任务 · 参数集 ——「启动参数」∈ 此维</text>

<rect x="1476" y="400" width="328" height="56" rx="5" fill="#f3eef7" stroke="#e0d8ea"/>
<text x="1490" y="420" font-weight="bold" fill="#7b5fb5">telic 目的</text>
<text x="1490" y="440" font-size="11" fill="#555555">交付产物 · 可信构建</text>

<rect x="1476" y="464" width="328" height="56" rx="5" fill="#f3eef7" stroke="#e0d8ea"/>
<text x="1490" y="484" font-weight="bold" fill="#7b5fb5">agentive 起源</text>
<text x="1490" y="504" font-size="11" fill="#555555">创建者 · 维护会话(工号)</text>
</g>

<line x1="1490" y1="580" x2="1790" y2="580" stroke="#7b5fb5" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1460" y="610" font-size="12" font-weight="bold" fill="#c88a3b">检索: Target「启动参数」→ constitutive.parameters</text>
<text x="1460" y="634" font-size="12" font-weight="bold" fill="#7b5fb5">返回: InformationResult = 参数清单(激活)</text>
<text x="1460" y="664" font-size="11.5" fill="#555555">排除: Operator 施事族 → qualia:none (无实体资格)</text>
<text x="1460" y="694" font-size="10.5" fill="#8a8f98">Qualia 行只挂实体族 FE；其余 FE 无行 —— 表以 FE 为键的体现</text>

<!-- ==========⑤ 认知体现========== -->
<rect x="1880" y="118" width="400" height="40" rx="6" fill="#3b7dd8"/>
<text x="2080" y="144" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">⑤ 认知体现 · Reflection</text>

<g font-size="12">
<circle cx="1915" cy="222" r="11" fill="#3b7dd8"/><text x="1915" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
<text x="1936" y="213" font-weight="bold" fill="#3a3530">激活 F4 帧命中</text>
<text x="1936" y="233" font-size="11" fill="#666666">触发词「查询」→ 帧与 FE 槽位全部就位</text>

<circle cx="1915" cy="282" r="11" fill="#3b7dd8"/><text x="1915" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
<text x="1936" y="273" font-weight="bold" fill="#3a3530">凸显 Target</text>
<text x="1936" y="293" font-size="11" fill="#666666">11 个标准子类未直接命中 → 转 Qualia 识别</text>

<circle cx="1915" cy="342" r="11" fill="#3b7dd8"/><text x="1915" y="347" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
<text x="1936" y="333" font-weight="bold" fill="#3a3530">Qualia 判别检索维度</text>
<text x="1936" y="353" font-size="11" fill="#666666">「参数」= Pipeline 实体的 constitutive 维，而非独立实体</text>

<circle cx="1915" cy="402" r="11" fill="#3b7dd8"/><text x="1915" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4</text>
<text x="1936" y="393" font-weight="bold" fill="#3a3530">只读判决 · 无危险默认</text>
<text x="1936" y="413" font-size="11" fill="#666666">F4 属只读动作 → C 级只读走轻量跳过(声明卡)</text>
</g>

<rect x="1880" y="436" width="380" height="196" rx="8" fill="#e9eff7" stroke="#3b7dd8" stroke-width="1.5"/>
<text x="1900" y="460" font-size="13" font-weight="bold" fill="#3b7dd8">ToolCallCandidate 判决输出</text>
<line x1="1896" y1="468" x2="2244" y2="468" stroke="#b9c9e8" stroke-width="1"/>
<text x="1900" y="490" font-size="12" font-weight="bold" fill="#3a3530">tool</text>
<text x="1945" y="490" font-size="12" fill="#555555">get_execution_schemes (经 Qualia 确认)</text>
<text x="1900" y="514" font-size="12" font-weight="bold" fill="#3a3530">params</text>
<text x="1945" y="514" font-size="11.5" fill="#555555">pipeline_id ← Pipeline(实体ID · @explore 定位)</text>
