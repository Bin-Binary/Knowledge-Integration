<rect x="1020" y="370" width="100" height="46" rx="5" fill="#f6eee1" stroke="#c88a3b"/>
<text x="1070" y="389" fill="#c88a3b">受事·检索维</text>
<text x="1070" y="405" font-size="10" fill="#777777">Target子类</text>
<rect x="1128" y="370" width="100" height="46" rx="5" fill="#f0ece2" stroke="#c9c2b4"/>
<text x="1178" y="389" fill="#3a3530" font-weight="bold">Target</text>
<text x="1178" y="405" font-size="10" fill="#777777">帧内槽位</text>
<rect x="1236" y="370" width="144" height="46" rx="5" fill="#f6eee1" stroke="#c88a3b"/>
<text x="1308" y="389" fill="#8a5a20">信息维度</text>
<text x="1308" y="405" font-size="10" fill="#8a8f98">非实体 · 检索式</text>

<rect x="1020" y="424" width="100" height="46" rx="5" fill="#f0ecf5" stroke="#7b5fb5"/>
