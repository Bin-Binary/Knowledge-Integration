<svg width="2400" height="1080" viewBox="0 0 2400 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
<marker id="arr" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto"><polygon points="10 0,0 3,10 6" fill="#888888"/></marker>
</defs>

<rect width="2400" height="1080" fill="#e8e2d5"/>
<g stroke="#c6c0b4" stroke-width="0.5">
<line x1="120" y1="80" x2="120" y2="1000"/><line x1="240" y1="80" x2="240" y2="1000"/>
<line x1="360" y1="80" x2="360" y2="1000"/><line x1="480" y1="80" x2="480" y2="1000"/>
<line x1="600" y1="80" x2="600" y2="1000"/><line x1="720" y1="80" x2="720" y2="1000"/>
<line x1="840" y1="80" x2="840" y2="1000"/><line x1="960" y1="80" x2="960" y2="1000"/>
<line x1="1080" y1="80" x2="1080" y2="1000"/><line x1="1200" y1="80" x2="1200" y2="1000"/>
<line x1="1320" y1="80" x2="1320" y2="1000"/><line x1="1440" y1="80" x2="1440" y2="1000"/>
<line x1="1560" y1="80" x2="1560" y2="1000"/><line x1="1680" y1="80" x2="1680" y2="1000"/>
<line x1="1800" y1="80" x2="1800" y2="1000"/><line x1="1920" y1="80" x2="1920" y2="1000"/>
<line x1="2040" y1="80" x2="2040" y2="1000"/><line x1="2160" y1="80" x2="2160" y2="1000"/>
<line x1="2280" y1="80" x2="2280" y2="1000"/>
<line x1="120" y1="80" x2="2280" y2="80"/><line x1="120" y1="160" x2="2280" y2="160"/>
<line x1="120" y1="240" x2="2280" y2="240"/><line x1="120" y1="320" x2="2280" y2="320"/>
<line x1="120" y1="400" x2="2280" y2="400"/><line x1="120" y1="480" x2="2280" y2="480"/>
<line x1="120" y1="560" x2="2280" y2="560"/><line x1="120" y1="640" x2="2280" y2="640"/>
<line x1="120" y1="720" x2="2280" y2="720"/><line x1="120" y1="800" x2="2280" y2="800"/>
<line x1="120" y1="880" x2="2280" y2="880"/><line x1="120" y1="960" x2="2280" y2="960"/>
</g>

<text x="1200" y="72" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">快照7 — 逐字回流</text>

<!-- H1 -->
<rect x="240" y="160" width="1920" height="140" fill="#f3ebe0" opacity="0.25" rx="4"/>
<rect x="160" y="160" width="72" height="140" fill="#9B8565" rx="4"/>
<text x="196" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" transform="rotate(-90,196,240)">H1</text>

<rect x="320" y="190" width="1720" height="80" fill="#ffffff" stroke="#9B8565" stroke-width="1.5" rx="8"/>
<text x="1180" y="240" text-anchor="middle" font-size="13" fill="#9B8565">GPU: 逐Token计算 → flush SSE → 继续生成</text>

<!-- H2 -->
<rect x="240" y="320" width="1920" height="160" fill="#f5ede5" opacity="0.25" rx="4"/>
<rect x="160" y="320" width="72" height="160" fill="#B08050" rx="4"/>
<text x="196" y="408" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" transform="rotate(-90,196,408)">H2</text>

<rect x="320" y="340" width="1720" height="100" fill="#ffffff" stroke="#B08050" stroke-width="1.5" rx="8"/>
<text x="1180" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#B08050">vLLM: Token流逐层向上传递</text>
<text x="1180" y="408" text-anchor="middle" font-size="12" fill="#666666">生成的Token → SSE事件 → header_proxy透传 → LiteLLM透传 → HAProxy透传 → 客户端</text>

<!-- H3 -->
<rect x="240" y="520" width="1920" height="200" fill="#e8f2e8" opacity="0.25" rx="4"/>
<rect x="160" y="520" width="72" height="200" fill="#5B9B6B" rx="4"/>
<text x="196" y="628" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" transform="rotate(-90,196,628)">H3</text>

<rect x="320" y="550" width="480" height="120" fill="#ffffff" stroke="#5B9B6B" stroke-width="1.5" rx="8"/>
<text x="560" y="590" text-anchor="middle" font-size="13" fill="#5B9B6B">header_proxy</text>
<text x="560" y="620" text-anchor="middle" font-size="12" fill="#666666">透传Token流</text>
<text x="560" y="650" text-anchor="middle" font-size="11" fill="#777777">计数器+1</text>

<rect x="880" y="550" width="480" height="120" fill="#ffffff" stroke="#5B9B6B" stroke-width="1.5" rx="8"/>
<text x="1120" y="590" text-anchor="middle" font-size="13" fill="#5B9B6B">LiteLLM</text>
<text x="1120" y="620" text-anchor="middle" font-size="12" fill="#666666">透传(stream=true)</text>
<text x="1120" y="650" text-anchor="middle" font-size="11" fill="#777777">记录延迟、Token数</text>

<rect x="1440" y="550" width="480" height="120" fill="#ffffff" stroke="#5B9B6B" stroke-width="1.5" rx="8"/>
<text x="1680" y="590" text-anchor="middle" font-size="13" fill="#5B9B6B">HAProxy</text>
<text x="1680" y="620" text-anchor="middle" font-size="12" fill="#666666">透传Token流</text>
<text x="1680" y="650" text-anchor="middle" font-size="11" fill="#777777">连接返回空闲态</text>

<!-- H4 -->
<rect x="240" y="760" width="1920" height="140" fill="#f3f1f7" opacity="0.3" rx="4"/>
<rect x="160" y="760" width="72" height="140" fill="#9B8BAB" rx="4"/>
<text x="196" y="840" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" transform="rotate(-90,196,840)">H4</text>

<rect x="320" y="790" width="1720" height="80" fill="#f3f1f7" stroke="#9B8BAB" stroke-width="2" rx="8"/>
<text x="1180" y="840" text-anchor="middle" font-size="13" font-weight="bold" fill="#9B8BAB">用户界面：逐字显示答案 "量" "子" "纠" "缠" ...</text>

<!-- 响应流箭头（不与边框重合） -->
<g stroke="#888888" stroke-width="2" stroke-dasharray="10,6" fill="none" marker-end="url(#arr)">
<line x1="560" y1="550" x2="560" y2="440"/>
<line x1="1120" y1="550" x2="1120" y2="440"/>
<line x1="1680" y1="550" x2="1680" y2="440"/>
<line x1="1180" y1="760" x2="1180" y2="720"/>
</g>

<!-- 底部标注 -->
<rect x="240" y="920" width="1720" height="60" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,3" rx="6"/>
<text x="1100" y="958" text-anchor="middle" font-size="13" font-weight="bold" fill="#888888">核心职责：Token沿 H1→H2→H3→H4 逆向逐层返回 · 时间点：T+117ms → T+500ms</text>
</svg>
