<text x="1200" y="72" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">快照4 — 验身指路</text>

<!-- H4 -->
<rect x="240" y="160" width="1920" height="120" fill="#f3f1f7" opacity="0.25" rx="4"/>
<text x="1200" y="230" text-anchor="middle" font-size="13" fill="#bbbbbb">H4 · 请求已发出，等待响应</text>

<!-- H3 -->
<rect x="240" y="320" width="1920" height="560" fill="#e8f2e8" opacity="0.3" rx="4"/>
<rect x="160" y="320" width="72" height="560" fill="#5B9B6B" rx="4"/>
<text x="196" y="610" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" transform="rotate(-90,196,610)">H3</text>

<!-- 三步操作 -->
<rect x="320" y="360" width="520" height="160" fill="#ffffff" stroke="#5B9B6B" stroke-width="1.5" rx="8"/>
<text x="580" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#5B9B6B">① 验身</text>
<text x="580" y="432" text-anchor="middle" font-size="12" fill="#666666">Authorization: Bearer ***</text>
<text x="580" y="460" text-anchor="middle" font-size="11" fill="#777777">匹配 Master Key → 通过</text>
<text x="580" y="490" text-anchor="middle" font-size="11" fill="#5B9B6B">鉴权成功</text>

<rect x="920" y="360" width="520" height="160" fill="#ffffff" stroke="#5B9B6B" stroke-width="1.5" rx="8"/>
<text x="1180" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#5B9B6B">② 查路由表</text>
<text x="1180" y="432" text-anchor="middle" font-size="12" fill="#666666">model = "GLM-V5.1"</text>
<text x="1180" y="460" text-anchor="middle" font-size="11" fill="#777777">找到4个候选后端</text>
<text x="1180" y="490" text-anchor="middle" font-size="11" fill="#5B9B6B">HIS/上海A3/西安A3/苏州A2</text>

<rect x="1520" y="360" width="520" height="160" fill="#e8f2e8" stroke="#5B9B6B" stroke-width="2" rx="8"/>
<text x="1780" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#5B9B6B">③ 决策：你去哪？</text>
<text x="1780" y="432" text-anchor="middle" font-size="12" fill="#666666">simple-shuffle(weight)</text>
<text x="1780" y="460" text-anchor="middle" font-size="11" fill="#777777">选中：上海绿区A3 (w:50)</text>
<text x="1780" y="490" text-anchor="middle" font-size="11" fill="#5B9B6B">api_base: :9333/v1</text>

<!-- 并发控制 -->
<rect x="320" y="560" width="1720" height="100" fill="#ffffff" stroke="#5B9B6B" stroke-width="1" stroke-dasharray="6,3" rx="6"/>
<text x="1180" y="602" text-anchor="middle" font-size="13" fill="#5B9B6B">并发控制：max_parallel_requests = 50 (当前后端) · 当前并发: 12 / 50 → 未达上限，允许转发</text>
<text x="1180" y="632" text-anchor="middle" font-size="11" fill="#777777">注意：密钥级限制(asyncio Semaphore)，不跨Pod共享 · 双Pod总并发 = 单Pod配置 × 2</text>

<!-- 路由表 -->
<rect x="320" y="690" width="1720" height="150" fill="#ffffff" stroke="#5B9B6B" stroke-width="1" stroke-dasharray="6,3" rx="6"/>
<text x="1180" y="722" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B9B6B">路由表（GLM-V5.1）</text>
<text x="500" y="760" text-anchor="middle" font-size="12" fill="#666666">HIS AITeam (w:26)</text>
<text x="800" y="760" text-anchor="middle" font-size="12" fill="#666666">上海绿区A3 (w:50) ← 选中</text>
<text x="1100" y="760" text-anchor="middle" font-size="12" fill="#666666">西安绿区A3 (w:20)</text>
<text x="1400" y="760" text-anchor="middle" font-size="12" fill="#666666">苏州A2 (w:20)</text>
<text x="1180" y="808" text-anchor="middle" font-size="11" fill="#777777">源：ConfigMap + DB动态路由 · 策略：simple-shuffle · 耗时: ~5ms (鉴权+路由决策)</text>

<!-- H2/H1 -->
<rect x="240" y="920" width="1920" height="80" fill="#f5f5f5" opacity="0.25" rx="4"/>
<text x="1200" y="970" text-anchor="middle" font-size="13" fill="#cccccc">H2 · H1 · 无活动</text>

</svg>
