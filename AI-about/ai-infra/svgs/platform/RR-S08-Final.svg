<text x="1680" y="456" text-anchor="middle" font-size="12" fill="#666666">监听933x · 无活跃转发</text>
<text x="1680" y="478" text-anchor="middle" font-size="11" fill="#777777">（同初始）</text>

<rect x="1960" y="380" width="100" height="30" fill="#5B9B6B" rx="15"/>
<text x="2010" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">变了</text>

<rect x="320" y="520" width="1720" height="160" fill="#e8f2e8" stroke="#5B9B6B" stroke-width="1" stroke-dasharray="6,3" rx="6"/>
