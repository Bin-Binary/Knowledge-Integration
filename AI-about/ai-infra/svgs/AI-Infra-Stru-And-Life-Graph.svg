<text x="1500" y="532" font-size="14" font-weight="bold" fill="#A07050">服务稳定</text>
<circle cx="1960" cy="527" r="9" fill="#A07050"/>
<text x="1980" y="532" font-size="14" font-weight="bold" fill="#A07050">性能优化</text>

<!-- H3行(平台与调度, center y=377) — L2(平台搭建) L3(采集指标) L4(调度优化) -->
