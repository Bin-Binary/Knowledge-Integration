<!-- ==========图例========== -->
<g transform="translate(60,840)">
<text x="0" y="0" font-size="15" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">图例</text>
<line x1="0" y1="10" x2="60" y2="10" stroke="#3a3530" stroke-width="0.8"/>
<circle cx="12" cy="35" r="7" fill="#8B7355"/><text x="28" y="39" font-size="13" fill="#666666">H1 硬件</text>
<circle cx="142" cy="35" r="7" fill="#A07050"/><text x="158" y="39" font-size="13" fill="#666666">H2 推理服务</text>
<circle cx="322" cy="35" r="7" fill="#6B8E6B"/><text x="338" y="39" font-size="13" fill="#666666">H3 平台与调度</text>
<circle cx="502" cy="35" r="7" fill="#7B6B8B"/><text x="518" y="39" font-size="13" fill="#666666">H4 顶层应用</text>
<text x="0" y="65" font-size="12" fill="#999999">● = 架构层在该生命周期阶段的职责参与</text>
<text x="500" y="65" font-size="12" fill="#999999">H2推理服务贯穿全周期L1-L4 · 模型/数据为横切资源，被H2加载、H1承载</text>
<text x="0" y="90" font-size="12" fill="#888888">依赖方向：H4 → H3 → H2 → H1（上层调用/调度下层）</text>
