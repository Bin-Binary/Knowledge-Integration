<text x="1000" y="232" text-anchor="middle" font-size="13" fill="#cccccc">—</text>
<text x="1480" y="232" text-anchor="middle" font-size="13" fill="#cccccc">—</text>
<text x="1960" y="232" text-anchor="middle" font-size="13" fill="#cccccc">—</text>

