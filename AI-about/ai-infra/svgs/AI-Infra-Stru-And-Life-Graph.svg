<text x="540" y="677" font-size="14" font-weight="bold" fill="#8B7355">算力规模</text>
<circle cx="1000" cy="672" r="9" fill="#8B7355"/>
<text x="1020" y="677" font-size="14" font-weight="bold" fill="#8B7355">硬件就位</text>
<circle cx="1960" cy="672" r="9" fill="#8B7355"/>
<text x="1980" y="677" font-size="14" font-weight="bold" fill="#8B7355">扩缩容</text>

<!-- H2行(推理服务, center y=527) — L1(技术路线) L2(跑通全链路) L3(服务稳定) L4(性能优化) -->
<circle cx="520" cy="527" r="9" fill="#A07050"/>
