<!-- ==========标题========== -->
<text x="1200" y="72" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a3530" font-family="KaiTi,STKaiti,serif">AI基础设施视图：结构 × 生命周期</text>
<text x="1200" y="96" text-anchor="middle" font-size="13" fill="#999999">H4调用H3调度 → H3调度H2推理 → H2依赖H1算力 · 模型为横切资源</text>

<!-- ==========坐标轴========== -->
<line x1="280" y1="160" x2="280" y2="740" stroke="#3a3530" stroke-width="2"/>
<line x1="280" y1="740" x2="2200" y2="740" stroke="#3a3530" stroke-width="2"/>
<polygon points="280,160 274,175 286,175" fill="#3a3530"/>
<polygon points="2200,740 2185,734 2185,746" fill="#3a3530"/>

<!-- Y轴标签(自底向上)：H1硬件 → H2推理服务 → H3平台与调度 → H4顶层应用 -->
<text x="260" y="676" text-anchor="end" font-size="14" font-weight="bold" fill="#8B7355">H1 硬件</text>
<text x="260" y="694" text-anchor="end" font-size="11" fill="#999999">GPU/NPU、存储、网络</text>
<text x="260" y="526" text-anchor="end" font-size="14" font-weight="bold" fill="#A07050">H2 推理服务</text>
<text x="260" y="544" text-anchor="end" font-size="11" fill="#999999">推理执行、API服务</text>
<text x="260" y="376" text-anchor="end" font-size="14" font-weight="bold" fill="#6B8E6B">H3 平台与调度</text>
<text x="260" y="394" text-anchor="end" font-size="11" fill="#999999">路由、负载均衡、监控</text>
<text x="260" y="226" text-anchor="end" font-size="14" font-weight="bold" fill="#7B6B8B">H4 顶层应用</text>
<text x="260" y="244" text-anchor="end" font-size="11" fill="#999999">业务功能、交互</text>
<text x="90" y="450" text-anchor="middle" font-size="13" fill="#888888" transform="rotate(-90,90,450)">架构分层（底→顶）</text>

<!-- X轴标签 -->
<text x="520" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">L1 规划与选型</text>
<text x="520" y="790" text-anchor="middle" font-size="11" fill="#999999">需求·选型</text>
<text x="1000" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">L2 部署与搭建</text>
<text x="1000" y="790" text-anchor="middle" font-size="11" fill="#999999">搭建·验证</text>
<text x="1480" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">L3 运行与观测</text>
<text x="1480" y="790" text-anchor="middle" font-size="11" fill="#999999">监控·保障</text>
<text x="1960" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3530">L4 优化与演进</text>
<text x="1960" y="790" text-anchor="middle" font-size="11" fill="#999999">优化·迭代</text>
<text x="1240" y="820" text-anchor="middle" font-size="13" fill="#888888">生命周期 →</text>

<!-- ==========网格线========== -->
<g stroke="#ccc5b8" stroke-width="1" stroke-dasharray="6,4">
<line x1="280" y1="300" x2="2200" y2="300"/>
