<svg width="2400" height="1080" viewBox="0 0 2400 1080" xmlns="http://www.w3.org/2000/svg">
<!-- ==========底层固定版式========== -->
<!-- 旧纸张底色：加深但稍微明亮一点点 -->
<rect width="2400" height="1080" fill="#e8e2d5"/>

<!-- 淡网格：稳定色值，不使用opacity -->
<g stroke="#c6c0b4" stroke-width="0.4">
  <!-- 竖线 -->
  <line x1="120" y1="80" x2="120" y2="1000"/>
  <line x1="240" y1="80" x2="240" y2="1000"/>
  <line x1="360" y1="80" x2="360" y2="1000"/>
  <line x1="480" y1="80" x2="480" y2="1000"/>
  <line x1="600" y1="80" x2="600" y2="1000"/>
  <line x1="720" y1="80" x2="720" y2="1000"/>
  <line x1="840" y1="80" x2="840" y2="1000"/>
  <line x1="960" y1="80" x2="960" y2="1000"/>
  <line x1="1080" y1="80" x2="1080" y2="1000"/>
  <line x1="1200" y1="80" x2="1200" y2="1000"/>
  <line x1="1320" y1="80" x2="1320" y2="1000"/>
  <line x1="1440" y1="80" x2="1440" y2="1000"/>
  <line x1="1560" y1="80" x2="1560" y2="1000"/>
  <line x1="1680" y1="80" x2="1680" y2="1000"/>
  <line x1="1800" y1="80" x2="1800" y2="1000"/>
  <line x1="1920" y1="80" x2="1920" y2="1000"/>
  <line x1="2040" y1="80" x2="2040" y2="1000"/>
  <line x1="2160" y1="80" x2="2160" y2="1000"/>
  <line x1="2280" y1="80" x2="2280" y2="1000"/>

  <!-- 横线 -->
  <line x1="120" y1="80" x2="2280" y2="80"/>
  <line x1="120" y1="160" x2="2280" y2="160"/>
  <line x1="120" y1="240" x2="2280" y2="240"/>
  <line x1="120" y1="320" x2="2280" y2="320"/>
  <line x1="120" y1="400" x2="2280" y2="400"/>
  <line x1="120" y1="480" x2="2280" y2="480"/>
  <line x1="120" y1="560" x2="2280" y2="560"/>
  <line x1="120" y1="640" x2="2280" y2="640"/>
  <line x1="120" y1="720" x2="2280" y2="720"/>
  <line x1="120" y1="800" x2="2280" y2="800"/>
  <line x1="120" y1="880" x2="2280" y2="880"/>
  <line x1="120" y1="960" x2="2280" y2="960"/>
</g>

<!-- ==========主体线稿区域========== -->
<defs>
    <!-- 样式声明 -->
    <style>
      .text-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #4A5568; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #1A202C; }
      .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #2D3748; }
      .layer-box { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }   
      /* 连接线样式 */
      .line-prompt { stroke: #3182CE; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .line-response { stroke: #38A169; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .line-inner { stroke: #A0AEC0; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }     
      /* 基础图形描边 */
      .icon-stroke { fill: none; stroke: #4A5568; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>   
    <!-- 箭头通用定义 -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3182CE"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38A169"/>
    </marker>
    <marker id="arrow-gray" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#A0AEC0"/>
    </marker>
    <!-- 标志组件定义 -->
    <!-- 模型标志 -->
    <g id="logo-model">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#EDF2F7"/>
      <path d="M12 20 Q20 10 28 20 Q20 30 12 20 Z" fill="none" stroke="#4A90E2" stroke-width="2"/>
      <circle cx="20" cy="20" r="3" fill="#4A90E2"/>
    </g>
    <!-- 推理服务器标志 -->
    <g id="logo-server">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#E6FFFA"/>
      <text x="20" y="25" text-anchor="middle" fill="#234E52" font-size="11" font-weight="bold" font-family="monospace">vLLM</text>
    </g>    
    <!-- 硬件加速器标志 -->
    <g id="logo-hardware">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#F0FFF4"/>
      <text x="20" y="25" text-anchor="middle" fill="#22543D" font-size="9" font-weight="bold">NVIDIA</text>
    </g>
  </defs>
<style>
      .text-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #4A5568; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #1A202C; }
      .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #2D3748; }
      .layer-box { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }   
      /* 连接线样式 */
      .line-prompt { stroke: #3182CE; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .line-response { stroke: #38A169; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .line-inner { stroke: #A0AEC0; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }     
      /* 基础图形描边 */
      .icon-stroke { fill: none; stroke: #4A5568; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>

  <g id="main-drawing">
<g transform="translate(326.00, 103.00) scale(2.1850)">
<!-- 白色底画布 -->
  <rect width="800" height="400" fill="#FFFFFF"/>
  
  <!-- ================= 用户及客户端区域 ================= -->
  <g transform="translate(40, 115)">
    <!-- 客户端背景卡片 -->
    <rect width="160" height="170" rx="12" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="1"/>    
    <!-- 优化的客户端图形组件 -->
    <g transform="translate(45, 25)">
      <!-- 用户躯干与头部 -->
      <circle cx="25" cy="22" r="10" class="icon-stroke"/>
      <path d="M5 48 C5 38, 45 38, 45 48" class="icon-stroke"/>
      <!-- 前置移动设备屏 -->
      <rect x="42" y="32" width="28" height="20" rx="3" fill="#FFFFFF" stroke="#4A5568" stroke-width="2"/>
      <path d="M50 52 L62 52" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
      <path d="M46 36 L54 36" stroke="#3182CE" stroke-width="1.5" stroke-linecap="round"/>
    </g>   
    <!-- 区域文字表意描述 -->
    <text x="80" y="125" text-anchor="middle" class="text-bold">AI Application</text>
    <text x="80" y="145" text-anchor="middle" class="text-main" fill="#718096">User Interface</text>
  </g>
  
  <!-- ================= 数据流通道 ================= -->
  <!-- Prompt 请求阶段 -->
  <path d="M210 170 L380 170" class="line-prompt"/>
  <text x="295" y="155" text-anchor="middle" class="text-main" font-weight="bold" fill="#3182CE">Prompt</text>
  
  <!-- Response 响应阶段 -->
  <path d="M380 230 L210 230" class="line-response"/>
  <text x="295" y="250" text-anchor="middle" class="text-main" font-weight="bold" fill="#38A169">Response</text>
  
  <!-- ================= 右侧：后端推理服务架构区域 ================= -->
  <g transform="translate(400, 45)">
    <!-- 架构主容器边框 -->
    <rect x="0" y="0" width="360" height="310" rx="14" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>  
    <rect x="0" y="0" width="360" height="45" rx="14" fill="#F7FAFC"/>
    <line x1="0" y1="45" x2="360" y2="45" stroke="#CBD5E0" stroke-width="1.5"/>    
    <!-- 容器主标题 -->
    <text x="180" y="28" text-anchor="middle" class="title-main">Inference API System</text>   
    <!-- 1. Model 图层单元 -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="310" height="56" rx="8" class="layer-box"/>
      <use href="#logo-model" x="15" y="8"/>
      <text x="70" y="33" class="text-bold">Model Layer</text>
      <text x="295" y="33" text-anchor="end" class="text-main" fill="#718096">LLM / VLM</text>
    </g>    
    <!-- 纵向数据调用链路指示 1 -->
    <path d="M180 126 L180 144" class="line-inner"/>
    <!-- 2. Inference Server 图层单元 -->
    <g transform="translate(25, 148)">
      <rect x="0" y="0" width="310" height="56" rx="8" class="layer-box"/>
      <use href="#logo-server" x="15" y="8"/>
      <text x="70" y="33" class="text-bold">Inference Server</text>
      <text x="295" y="33" text-anchor="end" class="text-main" fill="#718096">vLLM Engine</text>
    </g>    
    <!-- 纵向数据调用链路指示 2 -->
    <path d="M180 204 L180 222" class="line-inner"/>
    <!-- 3. Hardware Accelerator 图层单元 -->
    <g transform="translate(25, 226)">
      <rect x="0" y="0" width="310" height="56" rx="8" class="layer-box"/>
      <use href="#logo-hardware" x="15" y="8"/>
      <text x="70" y="33" class="text-bold">Hardware Accelerator</text>
      <text x="295" y="33" text-anchor="end" class="text-main" fill="#718096">GPU Cluster</text>
    </g>
  </g>
</g>
</g>

<!-- ==========标注引线组========== -->
<g id="annotations" stroke="#555555" stroke-width="1" stroke-dasharray="6 4" fill="none">
</g>

</svg>