<!-- ==========主体线稿区域========== -->
<defs>
  <marker id="arrow-tp" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#b5654a"/>
  </marker>
  <marker id="arrow-net" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#3b7dd8"/>
  </marker>
</defs>

<g id="main-drawing" font-family="sans-serif">

  <!-- ===== 标题 ===== -->
  <text x="1200" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D3748">P0 单节点 NPU 拓扑与 TP=8 张量并行</text>
  <text x="1200" y="138" text-anchor="middle" font-size="13" fill="#718096">ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7</text>

  <!-- ===== P0 节点外框 ===== -->
  <rect x="160" y="160" width="2080" height="560" fill="none" stroke="#3a3a3a" stroke-width="2" rx="6"/>
  <text x="200" y="190" font-size="16" font-weight="bold" fill="#3a3a3a">P0 节点 (85.25.15.101)</text>

  <!-- ================================================================ -->
  <!--  NPU 网格 4×2                                                    -->
  <!-- ================================================================ -->

  <!-- Row 1: NPU 0-3 -->
  <rect x="200" y="210" width="460" height="150" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="430" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D3748">NPU 0</text>
  <text x="430" y="265" text-anchor="middle" font-size="12" fill="#718096">MoE Expert 0,8,16...</text>
  <text x="430" y="288" text-anchor="middle" font-size="11" fill="#718096">EP分片</text>

  <rect x="700" y="210" width="460" height="150" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="930" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D3748">NPU 1</text>
  <text x="930" y="265" text-anchor="middle" font-size="12" fill="#718096">MoE Expert 1,9,17...</text>
  <text x="930" y="288" text-anchor="middle" font-size="11" fill="#718096">EP分片</text>

  <rect x="1200" y="210" width="460" height="150" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="1430" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D3748">NPU 2</text>
  <text x="1430" y="265" text-anchor="middle" font-size="12" fill="#718096">MoE Expert 2,10,18...</text>
  <text x="1430" y="288" text-anchor="middle" font-size="11" fill="#718096">EP分片</text>

  <rect x="1700" y="210" width="460" height="150" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="1930" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D3748">NPU 3</text>
  <text x="1930" y="265" text-anchor="middle" font-size="12" fill="#718096">MoE Expert 3,11,19...</text>
  <text x="1930" y="288" text-anchor="middle" font-size="11" fill="#718096">EP分片</text>

  <!-- Row 2: NPU 4-7 -->
  <rect x="200" y="410" width="460" height="150" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="430" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D3748">NPU 4</text>
  <text x="430" y="465" text-anchor="middle" font-size="12" fill="#718096">MoE Expert 4,12,20...</text>
  <text x="430" y="488" text-anchor="middle" font-size="11" fill="#718096">EP分片</text>

  <rect x="700" y="410" width="460" height="150" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="930" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D3748">NPU 5</text>
  <text x="930" y="465" text-anchor="middle" font-size="12" fill="#718096">MoE Expert 5,13,21...</text>
  <text x="930" y="488" text-anchor="middle" font-size="11" fill="#718096">EP分片</text>

  <rect x="1200" y="410" width="460" height="150" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="1430" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D3748">NPU 6</text>
  <text x="1430" y="465" text-anchor="middle" font-size="12" fill="#718096">MoE Expert 6,14,22...</text>
  <text x="1430" y="488" text-anchor="middle" font-size="11" fill="#718096">EP分片</text>

  <rect x="1700" y="410" width="460" height="150" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="1930" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D3748">NPU 7</text>
  <text x="1930" y="465" text-anchor="middle" font-size="12" fill="#718096">MoE Expert 7,15,23...</text>
  <text x="1930" y="488" text-anchor="middle" font-size="11" fill="#718096">EP分片</text>

  <!-- ================================================================ -->
  <!--  TP=8 通信箭头                                                    -->
  <!-- ================================================================ -->

  <!-- Row 1 水平 -->
  <line x1="660" y1="285" x2="700" y2="285" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>
  <line x1="1160" y1="285" x2="1200" y2="285" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>
  <line x1="1660" y1="285" x2="1700" y2="285" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>

  <!-- Row 2 水平 -->
  <line x1="660" y1="485" x2="700" y2="485" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>
  <line x1="1160" y1="485" x2="1200" y2="485" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>
  <line x1="1660" y1="485" x2="1700" y2="485" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>

  <!-- 垂直 -->
  <line x1="430" y1="360" x2="430" y2="410" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>
  <line x1="930" y1="360" x2="930" y2="410" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>
  <line x1="1430" y1="360" x2="1430" y2="410" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>
  <line x1="1930" y1="360" x2="1930" y2="410" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>

  <!-- HCCS 高速总线标注 -->
  <text x="1200" y="395" text-anchor="middle" font-size="12" fill="#718096">HCCS 高速总线</text>

  <!-- ================================================================ -->
  <!--  TP=8 标注（右侧）                                                -->
  <!-- ================================================================ -->

  <rect x="2180" y="210" width="160" height="130" fill="#ece8db" stroke="#b5654a" stroke-width="1.2" rx="4"/>
  <text x="2260" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#b5654a">TP=8</text>
  <text x="2260" y="265" text-anchor="middle" font-size="11" fill="#2D3748">张量并行</text>
  <text x="2260" y="290" text-anchor="middle" font-size="10" fill="#718096">矩阵拆分</text>
  <text x="2260" y="310" text-anchor="middle" font-size="10" fill="#718096">AllReduce</text>
  <text x="2260" y="330" text-anchor="middle" font-size="10" fill="#718096">同步</text>

  <!-- TP 指向虚线 -->
  <line x1="2160" y1="285" x2="2180" y2="285" stroke="#b5654a" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- ================================================================ -->
  <!--  网卡（底部）                                                      -->
  <!-- ================================================================ -->

  <rect x="700" y="590" width="500" height="50" fill="#ece8db" stroke="#3b7dd8" stroke-width="1.5" rx="4"/>
  <text x="950" y="621" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b7dd8">enp189s0f0</text>

  <!-- HCCL 箭头（网卡→NPU网格） -->
  <line x1="950" y1="590" x2="950" y2="560" stroke="#3b7dd8" stroke-width="2" marker-end="url(#arrow-net)"/>
  <text x="970" y="575" font-size="11" fill="#3b7dd8">HCCL通信</text>

  <!-- ================================================================ -->
  <!--  图例（右下）                                                      -->
  <!-- ================================================================ -->

  <rect x="1600" y="590" width="520" height="50" fill="none" stroke="#3a3a3a" stroke-width="1" rx="4"/>
  <text x="1660" y="620" font-size="12" font-weight="bold" fill="#2D3748">图例</text>
  <line x1="1720" y1="615" x2="1760" y2="615" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-tp)"/>
  <text x="1770" y="620" font-size="11" fill="#718096">TP 通信流</text>
  <line x1="1900" y1="615" x2="1940" y2="615" stroke="#3b7dd8" stroke-width="2" marker-end="url(#arrow-net)"/>
  <text x="1950" y="620" font-size="11" fill="#718096">HCCL 网络流</text>

</g>

<!-- ==========标注引线组========== -->
<g id="annotations" stroke="#555555" stroke-width="1" stroke-dasharray="6 4" fill="none">
</g>

</svg>