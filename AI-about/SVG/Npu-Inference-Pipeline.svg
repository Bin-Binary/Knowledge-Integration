<svg width="2400" height="1080" viewBox="0 0 2400 1080" xmlns="http://www.w3.org/2000/svg">
<!-- ==========底层固定版式========== -->
<rect width="2400" height="1080" fill="#e8e2d5"/>

<g stroke="#c6c0b4" stroke-width="0.5">
  <line x1="120" y1="80" x2="120" y2="1000"/>
  <line x1="240" y1="80" x2="240" y2="1000"/>
  <line x1="360" y1="80" x2="360" y2="1000"/>
  <line x1="480" y1="80" x2="480" y2="1000"/>
  <line x1="600" y1="80" x2="600" y2="1000"/>
  <line x1="720" y1="80" x2="720" y2="1000"/>
  <line x1="840" y1="80" x2="840" y2="1000"/>
  <line x1="960" y1="80" x2="960" y2="1000"/>
  <line x1="1080" y1="80" x2="1080" y2="1000"/>
  <line x1="1200" y1="80" x2="1200" y2="1000"/>
  <line x1="1320" y1="80" x2="1320" y2="1000"/>
  <line x1="1440" y1="80" x2="1440" y2="1000"/>
  <line x1="1560" y1="80" x2="1560" y2="1000"/>
  <line x1="1680" y1="80" x2="1680" y2="1000"/>
  <line x1="1800" y1="80" x2="1800" y2="1000"/>
  <line x1="1920" y1="80" x2="1920" y2="1000"/>
  <line x1="2040" y1="80" x2="2040" y2="1000"/>
  <line x1="2160" y1="80" x2="2160" y2="1000"/>
  <line x1="2280" y1="80" x2="2280" y2="1000"/>
  <line x1="120" y1="80" x2="2280" y2="80"/>
  <line x1="120" y1="160" x2="2280" y2="160"/>
  <line x1="120" y1="240" x2="2280" y2="240"/>
  <line x1="120" y1="320" x2="2280" y2="320"/>
  <line x1="120" y1="400" x2="2280" y2="400"/>
  <line x1="120" y1="480" x2="2280" y2="480"/>
  <line x1="120" y1="560" x2="2280" y2="560"/>
  <line x1="120" y1="640" x2="2280" y2="640"/>
  <line x1="120" y1="720" x2="2280" y2="720"/>
  <line x1="120" y1="800" x2="2280" y2="800"/>
  <line x1="120" y1="880" x2="2280" y2="880"/>
  <line x1="120" y1="960" x2="2280" y2="960"/>
</g>

<!-- ==========主体线稿区域========== -->
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#3a3a3a"/>
  </marker>
  <marker id="arrow-b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#3b7dd8"/>
  </marker>
  <marker id="arrow-r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#b5654a"/>
  </marker>
</defs>

<g id="main-drawing" font-family="sans-serif">

  <!-- ===== 标题 ===== -->
  <text x="1200" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D3748">NPU 内部推理流水线与优化机制</text>

  <!-- ================================================================ -->
  <!--  左栏：输入区  |  中栏：HBM+SRAM  |  右栏：输出+优化摘要          -->
  <!-- ================================================================ -->

  <!-- ===== 左栏：输入区 ===== -->
  <rect x="160" y="150" width="300" height="300" fill="none" stroke="#6b7280" stroke-width="1.5" rx="4"/>
  <text x="310" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">用户Prompt</text>

  <rect x="175" y="198" width="270" height="35" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="310" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">Chunked Prefill</text>

  <!-- 切割箭头 -->
  <line x1="310" y1="233" x2="310" y2="255" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="175" y="260" width="270" height="24" fill="#ece8db" stroke="#6b7280" stroke-width="0.8" rx="3"/>
  <text x="310" y="277" text-anchor="middle" font-size="10" fill="#2D3748">chunk_0</text>
  <rect x="175" y="290" width="270" height="24" fill="#ece8db" stroke="#6b7280" stroke-width="0.8" rx="3"/>
  <text x="310" y="307" text-anchor="middle" font-size="10" fill="#2D3748">chunk_1</text>
  <rect x="175" y="320" width="270" height="24" fill="#ece8db" stroke="#6b7280" stroke-width="0.8" rx="3"/>
  <text x="310" y="337" text-anchor="middle" font-size="10" fill="#2D3748">chunk_2</text>

  <!-- ===== 流转箭头：输入→HBM ===== -->
  <line x1="460" y1="225" x2="520" y2="225" stroke="#3b7dd8" stroke-width="2" marker-end="url(#arrow-b)"/>

  <!-- ===== 中栏上：HBM 区 ===== -->
  <rect x="520" y="150" width="640" height="150" fill="none" stroke="#b5654a" stroke-width="1.5" rx="4"/>
  <text x="840" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#b5654a">HBM 区 (显存)</text>

  <!-- 模型权重 -->
  <rect x="540" y="198" width="290" height="65" fill="#ece8db" stroke="#b5654a" stroke-width="0.8" rx="3"/>
  <text x="685" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">模型权重</text>
  <text x="685" y="240" text-anchor="middle" font-size="10" fill="#718096">W8A8量化后</text>

  <!-- KV Cache 页池 -->
  <rect x="850" y="198" width="290" height="65" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="995" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">KV Cache 页池</text>
  <text x="995" y="240" text-anchor="middle" font-size="10" fill="#718096">gpu-mem-util=0.95</text>

  <!-- ===== 流转箭头：HBM→SRAM ===== -->
  <line x1="840" y1="300" x2="840" y2="320" stroke="#b5654a" stroke-width="2" marker-end="url(#arrow-r)"/>

  <!-- ===== 中栏下：SRAM 区 ===== -->
  <rect x="520" y="320" width="640" height="240" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="840" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">SRAM 区 (片上缓存)</text>

  <!-- 当前层计算 -->
  <rect x="540" y="365" width="600" height="80" fill="#ece8db" stroke="#52b788" stroke-width="0.8" rx="3"/>
  <text x="840" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">当前层计算</text>

  <!-- Self-Attention -->
  <rect x="555" y="400" width="270" height="30" fill="none" stroke="#52b788" stroke-width="0.8" rx="2"/>
  <text x="690" y="420" text-anchor="middle" font-size="10" fill="#2D3748">Self-Attention (SA)</text>

  <!-- FFN -->
  <rect x="845" y="400" width="280" height="30" fill="none" stroke="#52b788" stroke-width="0.8" rx="2"/>
  <text x="985" y="420" text-anchor="middle" font-size="10" fill="#2D3748">FFN (前馈网络)</text>

  <text x="840" y="445" text-anchor="middle" font-size="10" fill="#718096">矩阵乘法 + 激活函数</text>

  <!-- 权重预取（虚线标注） -->
  <rect x="540" y="460" width="280" height="35" fill="none" stroke="#c88a3b" stroke-width="1.2" stroke-dasharray="4,2" rx="3"/>
  <text x="680" y="483" text-anchor="middle" font-size="11" font-weight="bold" fill="#c88a3b">权重预取</text>

  <!-- APC命中（虚线标注） -->
  <rect x="840" y="460" width="280" height="35" fill="none" stroke="#7b5fb5" stroke-width="1.2" stroke-dasharray="4,2" rx="3"/>
  <text x="980" y="483" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b5fb5">APC 前缀缓存复用</text>

  <!-- ===== 流转箭头：SRAM→输出 ===== -->
  <line x1="1160" y1="440" x2="1240" y2="440" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 右栏：输出区 ===== -->
  <rect x="1240" y="150" width="460" height="410" fill="none" stroke="#6b7280" stroke-width="1.5" rx="4"/>
  <text x="1470" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">输出</text>

  <!-- Token 流箭头 -->
  <line x1="1470" y1="195" x2="1470" y2="225" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1500" y="215" font-size="10" fill="#718096">Token流</text>

  <!-- 投机采样 -->
  <rect x="1255" y="240" width="430" height="70" fill="#ece8db" stroke="#c88a3b" stroke-width="1.2" rx="3"/>
  <text x="1470" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#c88a3b">投机采样</text>
  <text x="1470" y="285" text-anchor="middle" font-size="11" fill="#2D3748">deepseek_mtp</text>
  <text x="1470" y="302" text-anchor="middle" font-size="10" fill="#718096">猜3个Token → 验证</text>

  <!-- 最终输出 -->
  <rect x="1280" y="330" width="380" height="30" fill="#ece8db" stroke="#6b7280" stroke-width="0.8" rx="3"/>
  <text x="1470" y="350" text-anchor="middle" font-size="11" fill="#2D3748">最终输出</text>

  <!-- ===== 最右栏：关键优化机制摘要 ===== -->
  <rect x="1760" y="150" width="440" height="410" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="1980" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">关键优化机制</text>

  <!-- 权重预取摘要 -->
  <rect x="1775" y="198" width="410" height="60" fill="#ece8db" stroke="#c88a3b" stroke-width="0.8" rx="3"/>
  <text x="1980" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#c88a3b">权重预取</text>
  <text x="1980" y="240" text-anchor="middle" font-size="10" fill="#718096">消除流水线气泡，HBM→SRAM提前加载</text>

  <!-- APC 摘要 -->
  <rect x="1775" y="270" width="410" height="60" fill="#ece8db" stroke="#7b5fb5" stroke-width="0.8" rx="3"/>
  <text x="1980" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b5fb5">APC 前缀缓存复用</text>
  <text x="1980" y="312" text-anchor="middle" font-size="10" fill="#718096">RadixTree前缀匹配，零拷贝共享KV页</text>

  <!-- 投机采样摘要 -->
  <rect x="1775" y="342" width="410" height="60" fill="#ece8db" stroke="#c88a3b" stroke-width="0.8" rx="3"/>
  <text x="1980" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#c88a3b">投机采样</text>
  <text x="1980" y="384" text-anchor="middle" font-size="10" fill="#718096">同模型辅助头猜3Token，无需额外小模型</text>

  <!-- Chunked Prefill 摘要 -->
  <rect x="1775" y="414" width="410" height="60" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="1980" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#3b7dd8">Chunked Prefill</text>
  <text x="1980" y="456" text-anchor="middle" font-size="10" fill="#718096">长Prompt分块处理，降低首Token延迟</text>

  <!-- ================================================================ -->
  <!--  底部：异步调度双车道（y:610~770）                                 -->
  <!-- ================================================================ -->

  <rect x="160" y="610" width="2080" height="160" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="1200" y="638" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">异步调度 (双车道并行)</text>

  <!-- Lane 1: 网络I/O -->
  <rect x="200" y="660" width="900" height="40" fill="#ece8db" stroke="#3b7dd8" stroke-width="1.2" rx="3"/>
  <text x="650" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b7dd8">Lane 1: HTTP / RPC 网络I/O</text>

  <!-- Lane 2: NPU计算 -->
  <rect x="1180" y="660" width="900" height="40" fill="#ece8db" stroke="#c88a3b" stroke-width="1.2" rx="3"/>
  <text x="1630" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#c88a3b">Lane 2: NPU 矩阵计算</text>

  <!-- 并行汇合箭头 -->
  <path d="M 650 700 L 650 725 L 1100 725" stroke="#3b7dd8" stroke-width="1" stroke-dasharray="4,2" fill="none"/>
  <path d="M 1630 700 L 1630 725 L 1300 725" stroke="#c88a3b" stroke-width="1" stroke-dasharray="4,2" fill="none"/>
  <text x="1200" y="745" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">并行执行，消除流水线气泡</text>

</g>

<!-- ==========标注引线组========== -->
<g id="annotations" stroke="#555555" stroke-width="1" stroke-dasharray="6 4" fill="none">
</g>

</svg>