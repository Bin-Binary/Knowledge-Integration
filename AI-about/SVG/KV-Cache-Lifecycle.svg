<svg width="2400" height="1080" viewBox="0 0 2400 1080" xmlns="http://www.w3.org/2000/svg">
<!-- ==========底层固定版式========== -->
<rect width="2400" height="1080" fill="#e8e2d5"/>

<g stroke="#c6c0b4" stroke-width="0.5">
  <line x1="120" y1="80" x2="120" y2="1000"/>
  <line x1="240" y1="80" x2="240" y2="1000"/>
  <line x1="360" y1="80" x2="360" y2="1000"/>
  <line x1="480" y1="80" x2="480" y2="1000"/>
  <line x1="600" y1="80" x2="600" y2="1000"/>
  <line x1="720" y1="80" x2="720" y2="1000"/>
  <line x1="840" y1="80" x2="840" y2="1000"/>
  <line x1="960" y1="80" x2="960" y2="1000"/>
  <line x1="1080" y1="80" x2="1080" y2="1000"/>
  <line x1="1200" y1="80" x2="1200" y2="1000"/>
  <line x1="1320" y1="80" x2="1320" y2="1000"/>
  <line x1="1440" y1="80" x2="1440" y2="1000"/>
  <line x1="1560" y1="80" x2="1560" y2="1000"/>
  <line x1="1680" y1="80" x2="1680" y2="1000"/>
  <line x1="1800" y1="80" x2="1800" y2="1000"/>
  <line x1="1920" y1="80" x2="1920" y2="1000"/>
  <line x1="2040" y1="80" x2="2040" y2="1000"/>
  <line x1="2160" y1="80" x2="2160" y2="1000"/>
  <line x1="2280" y1="80" x2="2280" y2="1000"/>
  <line x1="120" y1="80" x2="2280" y2="80"/>
  <line x1="120" y1="160" x2="2280" y2="160"/>
  <line x1="120" y1="240" x2="2280" y2="240"/>
  <line x1="120" y1="320" x2="2280" y2="320"/>
  <line x1="120" y1="400" x2="2280" y2="400"/>
  <line x1="120" y1="480" x2="2280" y2="480"/>
  <line x1="120" y1="560" x2="2280" y2="560"/>
  <line x1="120" y1="640" x2="2280" y2="640"/>
  <line x1="120" y1="720" x2="2280" y2="720"/>
  <line x1="120" y1="800" x2="2280" y2="800"/>
  <line x1="120" y1="880" x2="2280" y2="880"/>
  <line x1="120" y1="960" x2="2280" y2="960"/>
</g>

<!-- ==========主体线稿区域========== -->
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#3a3a3a"/>
  </marker>
</defs>

<g id="main-drawing" font-family="sans-serif">

  <!-- ===== 标题 ===== -->
  <text x="1200" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D3748">KV Cache 内存生命周期</text>

  <!-- ================================================================ -->
  <!--  五阶段流水线（横向排列 y:150~410）                                -->
  <!-- ================================================================ -->

  <!-- 阶段1: Prefill -->
  <rect x="160" y="150" width="300" height="260" fill="none" stroke="#b5654a" stroke-width="1.5" rx="4"/>
  <text x="310" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#b5654a">阶段1: Prefill</text>
  <rect x="175" y="198" width="270" height="28" fill="#ece8db" stroke="#b5654a" stroke-width="0.8" rx="3"/>
  <text x="310" y="217" text-anchor="middle" font-size="11" fill="#2D3748">用户Prompt</text>
  <rect x="175" y="234" width="270" height="32" fill="#ece8db" stroke="#b5654a" stroke-width="0.8" rx="3"/>
  <text x="310" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">8卡 TP 并行</text>
  <rect x="175" y="274" width="270" height="28" fill="#ece8db" stroke="#52b788" stroke-width="1.2" rx="3"/>
  <text x="310" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">产生 KV Cache</text>

  <!-- 箭头1→2 -->
  <line x1="460" y1="280" x2="500" y2="280" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段2: 存储 -->
  <rect x="500" y="150" width="300" height="260" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="650" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">阶段2: 存储</text>
  <rect x="515" y="198" width="270" height="42" fill="#ece8db" stroke="#52b788" stroke-width="0.8" rx="3"/>
  <text x="650" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">PagedAttention</text>
  <text x="650" y="232" text-anchor="middle" font-size="10" fill="#718096">按页存储</text>
  <rect x="515" y="248" width="270" height="42" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="650" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">存入 HBM</text>
  <text x="650" y="282" text-anchor="middle" font-size="10" fill="#718096">95%显存页池</text>

  <!-- 箭头2→3 -->
  <line x1="800" y1="280" x2="840" y2="280" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段3: APC复用 -->
  <rect x="840" y="150" width="300" height="260" fill="none" stroke="#7b5fb5" stroke-width="1.5" rx="4"/>
  <text x="990" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b5fb5">阶段3: APC复用</text>
  <rect x="855" y="198" width="270" height="38" fill="#ece8db" stroke="#7b5fb5" stroke-width="0.8" rx="3"/>
  <text x="990" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">RadixTree</text>
  <text x="990" y="230" text-anchor="middle" font-size="10" fill="#718096">前缀匹配</text>
  <rect x="855" y="244" width="270" height="42" fill="#ece8db" stroke="#c88a3b" stroke-width="1.2" rx="3"/>
  <text x="990" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">零拷贝复用</text>
  <text x="990" y="278" text-anchor="middle" font-size="10" fill="#718096">相同前缀共享KV页</text>

  <!-- 箭头3→4 -->
  <line x1="1140" y1="280" x2="1180" y2="280" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段4: PD传输 -->
  <rect x="1180" y="150" width="300" height="260" fill="none" stroke="#3b7dd8" stroke-width="1.5" rx="4"/>
  <text x="1330" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b7dd8">阶段4: PD传输</text>
  <rect x="1195" y="198" width="270" height="38" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="1330" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">MooncakeConnector</text>
  <text x="1330" y="230" text-anchor="middle" font-size="10" fill="#718096">V1版本</text>
  <rect x="1195" y="244" width="270" height="42" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="1330" y="262" text-anchor="middle" font-size="11" fill="#2D3748">use_ascend_direct</text>
  <text x="1330" y="278" text-anchor="middle" font-size="10" fill="#718096">P节点HBM → D节点HBM</text>

  <!-- 箭头4→5 -->
  <line x1="1480" y1="280" x2="1520" y2="280" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段5: Decode -->
  <rect x="1520" y="150" width="240" height="260" fill="none" stroke="#c88a3b" stroke-width="1.5" rx="4"/>
  <text x="1640" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#c88a3b">阶段5: Decode</text>
  <rect x="1535" y="198" width="210" height="28" fill="#ece8db" stroke="#c88a3b" stroke-width="0.8" rx="3"/>
  <text x="1640" y="217" text-anchor="middle" font-size="11" fill="#2D3748">读KV</text>
  <rect x="1535" y="234" width="210" height="32" fill="#ece8db" stroke="#c88a3b" stroke-width="0.8" rx="3"/>
  <text x="1640" y="255" text-anchor="middle" font-size="11" fill="#2D3748">逐Token解码</text>
  <rect x="1535" y="274" width="210" height="28" fill="#ece8db" stroke="#3a3a3a" stroke-width="0.8" rx="3"/>
  <text x="1640" y="293" text-anchor="middle" font-size="11" fill="#2D3748">输出</text>

  <!-- ===== max-model-len 影响框（右上） ===== -->
  <rect x="1840" y="150" width="380" height="130" fill="none" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
  <text x="2030" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5654a">max-model-len = 115168</text>
  <text x="2030" y="208" text-anchor="middle" font-size="12" fill="#2D3748">→ 决定单请求最大KV占用</text>
  <text x="2030" y="232" text-anchor="middle" font-size="12" fill="#2D3748">→ 影响并发能力 (QPS)</text>

  <!-- ================================================================ -->
  <!--  中间行：P节点 / KV公式 / D节点（y:450~570）                       -->
  <!-- ================================================================ -->

  <!-- P节点角色 -->
  <rect x="160" y="450" width="300" height="120" fill="none" stroke="#b5654a" stroke-width="1.5" rx="4"/>
  <text x="310" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#b5654a">P节点角色</text>
  <text x="310" y="506" text-anchor="middle" font-size="12" fill="#2D3748">kv_role:</text>
  <text x="310" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">kv_producer</text>

  <!-- KV Cache 容量公式 -->
  <rect x="500" y="450" width="800" height="120" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="900" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">KV Cache 容量公式</text>
  <text x="900" y="515" text-anchor="middle" font-size="16" font-family="Consolas, monospace" font-weight="bold" fill="#2D3748">KV = 2 × L × H_kv × d_h × S × P</text>
  <text x="900" y="548" text-anchor="middle" font-size="11" fill="#718096">L=层数  H_kv=KV头数  d_h=头维度  S=序列长度  P=精度字节数</text>

  <!-- D节点角色 -->
  <rect x="1360" y="450" width="300" height="120" fill="none" stroke="#c88a3b" stroke-width="1.5" rx="4"/>
  <text x="1510" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#c88a3b">D节点角色</text>
  <text x="1510" y="506" text-anchor="middle" font-size="12" fill="#2D3748">kv_role:</text>
  <text x="1510" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">kv_consumer</text>

  <!-- ================================================================ -->
  <!--  底部：三层异构内存分级（y:620~780，左对齐x:160）                  -->
  <!-- ================================================================ -->

  <text x="1200" y="648" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D3748">三层异构内存分级</text>

  <!-- HBM -->
  <rect x="160" y="665" width="530" height="80" fill="none" stroke="#3b7dd8" stroke-width="1.5" rx="4"/>
  <text x="425" y="694" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b7dd8">HBM (显存)</text>
  <text x="425" y="718" text-anchor="middle" font-size="11" fill="#718096">热数据: KV Cache页池 + 活跃权重</text>

  <!-- 箭头 HBM→DRAM -->
  <line x1="690" y1="705" x2="730" y2="705" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DRAM -->
  <rect x="730" y="665" width="530" height="80" fill="none" stroke="#b55a7a" stroke-width="1.5" rx="4"/>
  <text x="995" y="694" text-anchor="middle" font-size="14" font-weight="bold" fill="#b55a7a">DRAM (系统内存)</text>
  <text x="995" y="718" text-anchor="middle" font-size="11" fill="#718096">温数据: 待用权重 + 模型代码</text>

  <!-- 箭头 DRAM→SSD -->
  <line x1="1260" y1="705" x2="1300" y2="705" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SSD -->
  <rect x="1300" y="665" width="530" height="80" fill="none" stroke="#6b7280" stroke-width="1.5" rx="4"/>
  <text x="1565" y="694" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">SSD (持久存储)</text>
  <text x="1565" y="718" text-anchor="middle" font-size="11" fill="#718096">冷数据: 模型文件存储</text>

</g>

<!-- ==========标注引线组========== -->
<g id="annotations" stroke="#555555" stroke-width="1" stroke-dasharray="6 4" fill="none">
</g>

</svg>