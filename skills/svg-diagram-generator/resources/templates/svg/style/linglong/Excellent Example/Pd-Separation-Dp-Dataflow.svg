<!-- ==========主体线稿区域========== -->
<defs>
  <marker id="arrow-dp" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#c88a3b"/>
  </marker>
  <marker id="arrow-kv" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#7b5fb5"/>
  </marker>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#3a3a3a"/>
  </marker>
</defs>

<g id="main-drawing" font-family="sans-serif">

  <!-- ===== 标题 ===== -->
  <text x="1200" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D3748">PD分离架构：P集群 (Prefill) → D集群 (Decode)</text>

  <!-- ================================================================ -->
  <!--  P集群（y:150~330）                                               -->
  <!-- ================================================================ -->

  <text x="1200" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b7dd8">P集群 (Prefill计算密集) → DP=4, TP=8</text>

  <!-- P0 -->
  <rect x="160" y="175" width="490" height="140" fill="none" stroke="#3b7dd8" stroke-width="1.5" rx="4"/>
  <text x="405" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b7dd8">P0 (rank 0)</text>
  <text x="405" y="220" text-anchor="middle" font-size="11" fill="#718096">85.25.15.101</text>
  <rect x="175" y="232" width="460" height="45" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="405" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">8× NPU (TP=8)</text>

  <!-- P1 -->
  <rect x="680" y="175" width="490" height="140" fill="none" stroke="#3b7dd8" stroke-width="1.5" rx="4"/>
  <text x="925" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b7dd8">P1 (rank 1)</text>
  <text x="925" y="220" text-anchor="middle" font-size="11" fill="#718096">85.25.15.102</text>
  <rect x="695" y="232" width="460" height="45" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="925" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">8× NPU (TP=8)</text>

  <!-- P2 -->
  <rect x="1200" y="175" width="490" height="140" fill="none" stroke="#3b7dd8" stroke-width="1.5" rx="4"/>
  <text x="1445" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b7dd8">P2 (rank 2)</text>
  <text x="1445" y="220" text-anchor="middle" font-size="11" fill="#718096">85.25.15.103</text>
  <rect x="1215" y="232" width="460" height="45" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="1445" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">8× NPU (TP=8)</text>

  <!-- P3 -->
  <rect x="1720" y="175" width="490" height="140" fill="none" stroke="#3b7dd8" stroke-width="1.5" rx="4"/>
  <text x="1965" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b7dd8">P3 (rank 3)</text>
  <text x="1965" y="220" text-anchor="middle" font-size="11" fill="#718096">85.25.15.104</text>
  <rect x="1735" y="232" width="460" height="45" fill="#ece8db" stroke="#3b7dd8" stroke-width="0.8" rx="3"/>
  <text x="1965" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">8× NPU (TP=8)</text>

  <!-- DP通信箭头 -->
  <line x1="650" y1="245" x2="680" y2="245" stroke="#c88a3b" stroke-width="2" marker-end="url(#arrow-dp)"/>
  <line x1="1170" y1="245" x2="1200" y2="245" stroke="#c88a3b" stroke-width="2" marker-end="url(#arrow-dp)"/>
  <line x1="1690" y1="245" x2="1720" y2="245" stroke="#c88a3b" stroke-width="2" marker-end="url(#arrow-dp)"/>
  <text x="1200" y="170" text-anchor="middle" font-size="11" fill="#c88a3b">DP通信 (HCCL网络)</text>

  <!-- DP=4 标注 -->
  <rect x="490" y="330" width="410" height="32" fill="#ece8db" stroke="#c88a3b" stroke-width="1.2" rx="3"/>
  <text x="695" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#c88a3b">DP=4 数据并行</text>

  <text x="1505" y="351" text-anchor="middle" font-size="11" fill="#718096">各P节点处理不同Prompt批次</text>

  <!-- ================================================================ -->
  <!--  KV Cache 传输（y:380~440）                                       -->
  <!-- ================================================================ -->

  <text x="1200" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#7b5fb5">↓ KV Cache 传输 ↓</text>
  <text x="1200" y="412" text-anchor="middle" font-size="11" fill="#7b5fb5">MooncakeConnector / use_ascend_direct</text>
  <text x="1200" y="432" text-anchor="middle" font-size="11" fill="#718096">kv_producer (P) → kv_consumer (D)</text>

  <!-- KV传输箭头（P→D） -->
  <line x1="405" y1="315" x2="405" y2="470" stroke="#7b5fb5" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-kv)"/>
  <line x1="925" y1="315" x2="925" y2="470" stroke="#7b5fb5" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-kv)"/>
  <line x1="1445" y1="315" x2="1445" y2="470" stroke="#7b5fb5" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-kv)"/>
  <line x1="1965" y1="315" x2="1965" y2="470" stroke="#7b5fb5" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-kv)"/>

  <!-- ================================================================ -->
  <!--  D集群（y:470~700）                                               -->
  <!-- ================================================================ -->

  <text x="1200" y="490" text-anchor="middle" font-size="16" font-weight="bold" fill="#52b788">D集群 (Decode访存密集) → DP=8, TP=4</text>

  <!-- D0-D3 第一排 -->
  <rect x="160" y="510" width="490" height="75" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="405" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">D0</text>
  <text x="405" y="557" text-anchor="middle" font-size="11" fill="#2D3748">4× NPU (TP=4)</text>

  <rect x="680" y="510" width="490" height="75" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="925" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">D1</text>
  <text x="925" y="557" text-anchor="middle" font-size="11" fill="#2D3748">4× NPU (TP=4)</text>

  <rect x="1200" y="510" width="490" height="75" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="1445" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">D2</text>
  <text x="1445" y="557" text-anchor="middle" font-size="11" fill="#2D3748">4× NPU (TP=4)</text>

  <rect x="1720" y="510" width="490" height="75" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="1965" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">D3</text>
  <text x="1965" y="557" text-anchor="middle" font-size="11" fill="#2D3748">4× NPU (TP=4)</text>

  <!-- D4-D7 第二排 -->
  <rect x="160" y="605" width="490" height="75" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="405" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">D4</text>
  <text x="405" y="652" text-anchor="middle" font-size="11" fill="#2D3748">4× NPU (TP=4)</text>

  <rect x="680" y="605" width="490" height="75" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="925" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">D5</text>
  <text x="925" y="652" text-anchor="middle" font-size="11" fill="#2D3748">4× NPU (TP=4)</text>

  <rect x="1200" y="605" width="490" height="75" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="1445" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">D6</text>
  <text x="1445" y="652" text-anchor="middle" font-size="11" fill="#2D3748">4× NPU (TP=4)</text>

  <rect x="1720" y="605" width="490" height="75" fill="none" stroke="#52b788" stroke-width="1.5" rx="4"/>
  <text x="1965" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#52b788">D7</text>
  <text x="1965" y="652" text-anchor="middle" font-size="11" fill="#2D3748">4× NPU (TP=4)</text>

  <!-- DP=8 标注 -->
  <rect x="490" y="700" width="410" height="32" fill="#ece8db" stroke="#52b788" stroke-width="1.2" rx="3"/>
  <text x="695" y="721" text-anchor="middle" font-size="12" font-weight="bold" fill="#52b788">DP=8 数据并行</text>

  <text x="1505" y="721" text-anchor="middle" font-size="11" fill="#718096">各D节点处理不同请求解码</text>

  <!-- ================================================================ -->
  <!--  底部：配置对比 + 原理说明（y:760~860）                            -->
  <!-- ================================================================ -->

  <!-- 配置对比 -->
  <rect x="160" y="760" width="1000" height="90" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="660" y="790" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">配置对比</text>
  <text x="370" y="818" text-anchor="middle" font-size="12" fill="#3b7dd8">P: dp=4, tp=8 (高TP压算力)</text>
  <text x="950" y="818" text-anchor="middle" font-size="12" fill="#52b788">D: dp=8, tp=4 (高DP扩并发)</text>

  <!-- 原理说明 -->
  <rect x="1220" y="760" width="1000" height="90" fill="none" stroke="#3a3a3a" stroke-width="1.5" rx="4"/>
  <text x="1720" y="790" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">PD分离原理</text>
  <text x="1720" y="818" text-anchor="middle" font-size="12" fill="#718096">Prefill计算密集→高TP | Decode访存密集→高DP</text>

</g>

<!-- ==========标注引线组========== -->
<g id="annotations" stroke="#555555" stroke-width="1" stroke-dasharray="6 4" fill="none">
</g>

</svg>
